<style>

  @media (max-width: 767px) {

  @media (min-width: 768px) {
    .mobile-only { display: none !important; }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }

    position: fixed; top: 20px; right: 20px; z-index: 9000;

    animation: slideDown 220ms ease both;

  .modal-backdrop {
    position: fixed; inset: 0; z-index: 800;
    background: rgba(20,18,12,0.45);

const COUNTRIES = [
  'India','United States','United Kingdom','Canada','Australia','Singapore','United Arab Emirates',
  'Germany','France','Netherlands','Sweden','Switzerland','Norway','Denmark','Finland','Belgium',
  'Austria','Ireland','Italy','Spain','Portugal','Poland','Czech Republic','Hungary','Romania',

  'New Zealand','Fiji','Papua New Guinea','Russia','Ukraine','Kazakhstan','Georgia','Armenia',
  'Other',
].sort((a,b)=>{
  // Pin India and a few common ones at top
  const top=['India','United States','United Kingdom','Singapore','United Arab Emirates','Canada','Australia'];
  const ai=top.indexOf(a), bi=top.indexOf(b);
  if(ai!==-1||bi!==-1){ if(ai===-1)return 1; if(bi===-1)return -1; return ai-bi; }

// ── Searchable country dropdown ───────────────────────────────
function CountrySelect({ value, onChange, error }) {
  const [open,   setOpen]   = React.useState(false);
  const [query,  setQuery]  = React.useState('');
  const ref = React.useRef(null);

  // Close on outside click
  React.useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const filtered = query.trim()
    ? COUNTRIES.filter(c => c.toLowerCase().includes(query.toLowerCase()))
    : COUNTRIES;

  const select = (c) => { onChange(c); setQuery(''); setOpen(false); };

  return (
    <div ref={ref} style={{position:'relative',width:'100%'}}>
      <div
        onClick={()=>setOpen(o=>!o)}
        style={{
          display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:'0 12px',height:38,cursor:'pointer',
          background:TOKENS.surface,
          border:`0.5px solid ${error?TOKENS.closing:open?TOKENS.ink:TOKENS.hair}`,
          borderRadius:8,userSelect:'none',
        }}
      >
        <span style={{fontFamily:SANS,fontSize:13,color:value?TOKENS.ink:TOKENS.ink3}}>
          {value || 'Select country…'}
        </span>
        <span style={{color:TOKENS.ink3,display:'inline-flex',transform:open?'rotate(180deg)':'none',transition:'transform 150ms'}}>
          {Icon.chevron(12)}
        </span>
      </div>

      {open && (
        <div style={{
          position:'absolute',top:'calc(100% + 4px)',left:0,right:0,zIndex:500,
          background:TOKENS.card,border:`0.5px solid ${TOKENS.hair}`,
          borderRadius:10,boxShadow:'0 8px 24px rgba(20,18,12,0.12)',
          overflow:'hidden',maxHeight:280,display:'flex',flexDirection:'column',
        }}>
          {/* Search box */}
          <div style={{padding:'8px 10px',borderBottom:`0.5px solid ${TOKENS.hair}`,flexShrink:0}}>
            <div style={{display:'flex',alignItems:'center',gap:6,padding:'0 10px',height:32,background:TOKENS.surface,borderRadius:6,border:`0.5px solid ${TOKENS.hair}`}}>
              {Icon.search(12)}
              <input
                autoFocus
                placeholder="Search country…"
                value={query}
                onChange={e=>setQuery(e.target.value)}
                style={{flex:1,border:0,outline:0,background:'transparent',fontFamily:SANS,fontSize:12,color:TOKENS.ink}}
              />
              {query && (
                <button onClick={()=>setQuery('')} style={{border:0,background:'transparent',cursor:'pointer',color:TOKENS.ink3,padding:0,display:'flex'}}>
                  {Icon.close(10)}
                </button>
              )}
            </div>
          </div>
          {/* Options */}
          <div style={{overflowY:'auto',flex:1}}>
            {filtered.length===0 ? (
              <div style={{padding:'12px 14px',fontFamily:SANS,fontSize:12,color:TOKENS.ink3}}>No country found</div>
            ) : filtered.map(c=>(
              <button key={c} onClick={()=>select(c)} style={{
                display:'block',width:'100%',textAlign:'left',padding:'9px 14px',
                border:0,cursor:'pointer',fontFamily:SANS,fontSize:13,
                background:c===value?TOKENS.raiseBg:'transparent',
                color:c===value?TOKENS.raise:TOKENS.ink,
                transition:'background 80ms',
              }}
                onMouseEnter={e=>{ if(c!==value) e.currentTarget.style.background=TOKENS.hair2; }}
                onMouseLeave={e=>{ if(c!==value) e.currentTarget.style.background='transparent'; }}
              >
                {c===value && <span style={{marginRight:6}}>✓</span>}{c}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function useMediaQuery(q) {
  const [m, setM] = React.useState(() => window.matchMedia(q).matches);
  React.useEffect(() => {
    const mq = window.matchMedia(q);
    const h = (e) => setM(e.matches);
    mq.addEventListener('change', h);
    return () => mq.removeEventListener('change', h);
  }, [q]);
  return m;
}

function fmtMoney(n, currency='₹') {
  if (currency === '₹') {
    // Indian numbering: Cr / L / k
    if (n >= 10000000) return `₹${(n/10000000).toFixed(n%10000000===0?0:1)}Cr`;
    if (n >= 100000)   return `₹${(n/100000).toFixed(n%100000===0?0:1)}L`;
    if (n >= 1000)     return `₹${(n/1000).toFixed(0)}k`;
    return `₹${n}`;
  }
  if (n>=1000000) return `${currency}${(n/1000000).toFixed(n%1000000===0?0:1)}M`;
  if (n>=1000)    return `${currency}${(n/1000).toFixed(0)}k`;
  return `${currency}${n}`;
}

async function fbSaveProfile(uid, data) {

async function fbFetchProfile(uid) {

  await window.sbClient.auth.signInWithOAuth({

// ─── Toast system ─────────────────────────────────────────────────────────────
const ToastContext = React.createContext(null);

function ToastProvider({ children }) {
  const [toasts, setToasts] = React.useState([]);
  const add = React.useCallback((msg, tone='success', duration=3500) => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, tone }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), duration);
  }, []);
  const toneStyle = (tone) => ({
    success: { bg:TOKENS.raiseBg, border:`0.5px solid rgba(31,93,58,0.25)`, color:TOKENS.raise },
    error:   { bg:TOKENS.closingBg, border:`0.5px solid rgba(122,31,31,0.25)`, color:TOKENS.closing },
    info:    { bg:TOKENS.blueBg, border:`0.5px solid rgba(26,58,92,0.2)`, color:TOKENS.blue },
    warn:    { bg:TOKENS.warnBg, border:`0.5px solid rgba(138,74,28,0.25)`, color:TOKENS.warn },
  }[tone] || {});
  return (
    <ToastContext.Provider value={add}>
      {children}
      <div className="toast-container">
        {toasts.map(t => {
          const s = toneStyle(t.tone);
          return (
            <div key={t.id} className="toast" style={{
              background:s.bg, border:s.border, color:s.color,
              borderRadius:10, padding:'12px 16px',
              fontFamily:SANS, fontSize:13, fontWeight:500,
              boxShadow:'0 4px 16px rgba(20,18,12,0.12)',
              display:'flex', alignItems:'center', gap:10,
            }}>
              {t.tone==='success' && Icon.check(14)}
              {t.tone==='error'   && Icon.close(14)}
              {t.tone==='info'    && Icon.bell(14)}
              {t.msg}
            </div>
          );
        })}
      </div>
    </ToastContext.Provider>
  );
}

function useToast() {
  const ctx = React.useContext(ToastContext);
  if (!ctx) return () => {};
  return ctx;
}

// ─── Trust Badge Panel ───
// `verified` prop gates the 'KYC verified' badge so unverified ideas never show it (P02)
function TrustBadgeRow({ badges, verified }) {
  if (!badges || !badges.length) return null;
  // Remove 'KYC verified' badge if the idea is not verified
  const filteredBadges = badges.filter(b => {
    if (b.toLowerCase().includes('kyc') || b.toLowerCase().includes('verified')) {
      return verified === true;
    }
    return true;
  });
  if (!filteredBadges.length) return null;
  const iconForBadge = (b) => {
    if (b.includes('KYC') || b.includes('verified')) return Icon.shield(12);
    if (b.includes('revenue') || b.includes('Revenue')) return Icon.chart(12);
    if (b.includes('Demo') || b.includes('demo')) return Icon.play(12);
    if (b.includes('Closing')) return Icon.clock(12);
    if (b.includes('Live')) return Icon.globe(12);
    return Icon.check(12);
  };
  return (
    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
      {filteredBadges.map(b => (
        <span key={b} style={{
          display:'inline-flex',alignItems:'center',gap:5,
          padding:'4px 10px',borderRadius:999,
          background:TOKENS.raiseBg,color:TOKENS.raise,
          fontFamily:SANS,fontSize:11,fontWeight:500,
          border:`0.5px solid rgba(31,93,58,0.2)`,
        }}>
          <span style={{display:'inline-flex'}}>{iconForBadge(b)}</span>{b}
        </span>
      ))}
    </div>
  );
}

// ─── Milestone Timeline ───
function MilestoneTimeline({ milestones, vertical=false }) {
  if (vertical) {
    return (
      <div style={{display:'flex',flexDirection:'column',gap:0}}>
        {milestones.map((m,i) => (
          <div key={i} style={{display:'flex',gap:16,paddingBottom: i<milestones.length-1?20:0}}>
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:0}}>
              <div style={{
                width:22,height:22,borderRadius:999,flexShrink:0,
                display:'flex',alignItems:'center',justifyContent:'center',
                background:m.done?TOKENS.raise:(m.current?TOKENS.ink:TOKENS.surface),
                border:`0.5px solid ${m.done||m.current?TOKENS.ink:TOKENS.hair}`,
                color:m.done||m.current?'#fbfaf6':TOKENS.ink4,
              }}>{m.done?Icon.check(11):<span style={{fontFamily:MONO,fontSize:9}}>{i+1}</span>}</div>
              {i<milestones.length-1 && <div style={{width:1,flex:1,minHeight:12,background:m.done?TOKENS.raise:TOKENS.hair,marginTop:3}}/>}
            </div>
            <div style={{paddingTop:2,paddingBottom:4}}>
              <div style={{fontFamily:SANS,fontSize:13,fontWeight:500,color:m.current?TOKENS.ink:(m.done?TOKENS.ink2:TOKENS.ink3)}}>{m.label}</div>
              {m.date && <div style={{fontFamily:MONO,fontSize:10,color:TOKENS.ink4,marginTop:2}}>{m.date}</div>}
              {m.note && <div style={{fontFamily:SANS,fontSize:12,color:TOKENS.ink3,marginTop:3,lineHeight:1.4}}>{m.note}</div>}
            </div>
          </div>
        ))}
      </div>
    );
  }
  return (
    <div style={{position:'relative',display:'flex',gap:0}}>
      <div style={{position:'absolute',top:11,left:14,right:14,height:1,background:TOKENS.hair}}/>
      {milestones.map((m,i) => (
        <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:8,position:'relative'}}>
          <div style={{
            width:22,height:22,borderRadius:999,zIndex:1,
            display:'flex',alignItems:'center',justifyContent:'center',
            background:m.done?TOKENS.raise:(m.current?TOKENS.ink:TOKENS.surface),
            border:`0.5px solid ${m.done||m.current?TOKENS.ink:TOKENS.hair}`,
            color:m.done||m.current?'#fbfaf6':TOKENS.ink4,
          }}>{m.done?Icon.check(11):<span style={{fontFamily:MONO,fontSize:9}}>{i+1}</span>}</div>
          <div style={{fontFamily:SANS,fontSize:11,color:m.current?TOKENS.ink:(m.done?TOKENS.ink2:TOKENS.ink3),textAlign:'center',lineHeight:1.3}}>{m.label}</div>
          {m.date && <div style={{fontFamily:MONO,fontSize:9,color:TOKENS.ink4}}>{m.date}</div>}
        </div>
      ))}
    </div>
  );
}

function Nav({ current, go, user, onSignOut, userXP=0, userStreak=0, userBadges=[] }) {
  const isMobile = useMediaQuery('(max-width: 767px)');
  const [drawerOpen, setDrawerOpen] = React.useState(false);

  React.useEffect(() => {
    const handler = () => setDrawerOpen(true);
    document.addEventListener('openDrawer', handler);
    return () => document.removeEventListener('openDrawer', handler);
  }, []);

  const sections = [
    { label:'Browse', items:[
      { id:'home',      label:'Home',       icon:Icon.home() },
      { id:'discover',  label:'Discover',   icon:Icon.spark() },
      { id:'shortlist', label:'Shortlist',  icon:Icon.bookmark() },
      { id:'compare',   label:'Compare',    icon:Icon.filter() },
    ]},
    { label:'Community', items:[
      { id:'leaderboard',    label:'Leaderboard',    icon:Icon.trophy() },
      { id:'notifications',  label:'Notifications',  icon:Icon.bell() },
    ]},
    { label:'Back & Build', items:[
      { id:'portfolio',         label:'My Portfolio',       icon:Icon.shield() },
      { id:'founder-onboard',   label:'List my startup',    icon:Icon.plus() },
      { id:'founder-dashboard', label:'Founder dashboard',  icon:Icon.doc() },
    ]},
    { label:'Pro Tools ✨', items:[
      { id:'ai-studio',  label:'AI Studio',        icon:Icon.spark() },
      { id:'seo-tools',  label:'SEO & Marketing',  icon:Icon.globe() },
      { id:'pricing',    label:'Upgrade to Pro',   icon:Icon.zap() },
    ]},
    { label:'Account', items:[
      { id:'profile-settings', label:'Profile & settings', icon:Icon.settings() },
      { id:'strategy',         label:'Strategy memo',      icon:Icon.doc() },
      { id:'india-guide',      label:'India reg guide',    icon:Icon.shield() },
    ]},
    { label:'Admin', items:[
      { id:'admin', label:'Moderation', icon:Icon.flag() },
    ]},
  ];

  const NavItem = ({ it, onClick }) => {
    const active = current === it.id;
    return (
      <button onClick={()=>{ go(it.id); onClick?.(); }} style={{
        display:'flex',alignItems:'center',gap:10,
        width:'100%',padding:'8px 10px',borderRadius:7,
        background:active?'#efece4':'transparent',
        border:0,cursor:'pointer',
        fontFamily:SANS,fontSize:13,fontWeight:active?500:400,
        color:active?TOKENS.ink:TOKENS.ink2,
        textAlign:'left',transition:'background 120ms',
      }}
        onMouseEnter={(e)=>{ if(!active) e.currentTarget.style.background=TOKENS.hair2; }}
        onMouseLeave={(e)=>{ if(!active) e.currentTarget.style.background='transparent'; }}
      >
        <span style={{color:active?TOKENS.ink:TOKENS.ink3}}>{it.icon}</span>
        {it.label}
      </button>
    );
  };

  const SidebarContent = ({ onClose }) => (
    <>
      <div style={{padding:'0 6px 18px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <Logo size={20}/>
        {onClose && <button onClick={onClose} style={{border:0,background:'transparent',color:TOKENS.ink3,cursor:'pointer',padding:4,display:'flex'}}>{Icon.close(16)}</button>}
      </div>
      {sections.map(sec => (
        <div key={sec.label}>
          <div style={{fontFamily:MONO,fontSize:9,letterSpacing:'0.12em',textTransform:'uppercase',color:TOKENS.ink4,padding:'8px 10px 4px'}}>{sec.label}</div>
          {sec.items.map(it => <NavItem key={it.id} it={it} onClick={onClose}/>)}
        </div>
      ))}
      <div style={{flex:1}}/>
      <div style={{padding:'0 10px 8px'}}>
        <GamificationBar xp={userXP} streak={userStreak} badges={userBadges}/>
      </div>
      <div style={{padding:'12px 10px',borderTop:`0.5px solid ${TOKENS.hair}`,marginTop:4}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <Avatar name={user.name} initials={user.initials} tone="#3a3830" size={28}/>
          <div style={{minWidth:0,flex:1}}>
            <div style={{fontFamily:SANS,fontSize:12,fontWeight:500,color:TOKENS.ink,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{user.name}</div>

          </div>
          {onSignOut && (
            <button onClick={onSignOut} title="Sign out" style={{
              border:0,background:'transparent',cursor:'pointer',
              color:TOKENS.ink4,padding:4,display:'flex',flexShrink:0,

            </button>
          )}
        </div>
      </div>
    </>
  );

  if (isMobile) {
    const tabItems = [
      { id:'home',          label:'Home',        icon:Icon.home },
      { id:'discover',      label:'Discover',    icon:Icon.spark },
      { id:'shortlist',     label:'Saved',        icon:Icon.bookmark },
      { id:'portfolio',     label:'Portfolio',   icon:Icon.shield },
      { id:'notifications', label:'Alerts',      icon:Icon.bell },
    ];
    return (
      <>
        {/* Mobile drawer overlay */}
        {drawerOpen && (
          <div onClick={()=>setDrawerOpen(false)} style={{position:'fixed',inset:0,zIndex:200,background:'rgba(20,18,12,0.4)',backdropFilter:'blur(4px)'}}>
            <div onClick={(e)=>e.stopPropagation()} style={{
              position:'fixed',left:0,top:0,bottom:0,width:260,
              background:TOKENS.bg,padding:'20px 14px',
              display:'flex',flexDirection:'column',gap:4,
              borderRight:`0.5px solid ${TOKENS.hair}`,zIndex:201,
              overflowY:'auto',
            }}>
              <SidebarContent onClose={()=>setDrawerOpen(false)}/>
            </div>
          </div>
        )}
        {/* Bottom tab bar */}
        <nav style={{
          position:'fixed',bottom:0,left:0,right:0,zIndex:100,
          background:TOKENS.surface,borderTop:`0.5px solid ${TOKENS.hair}`,
          display:'flex',padding:'8px 0 max(8px,env(safe-area-inset-bottom))',
          backdropFilter:'blur(12px)',
        }}>
          {tabItems.map(it => {
            const active = current===it.id;
            return (
              <button key={it.id} onClick={()=>go(it.id)} style={{
                flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,
                border:0,background:'transparent',cursor:'pointer',padding:'2px 0',
                color:active?TOKENS.ink:TOKENS.ink4,transition:'color 120ms',
              }}>
                {it.icon(active?16:14)}
                <span style={{fontFamily:SANS,fontSize:10,fontWeight:active?500:400}}>{it.label}</span>
              </button>
            );
          })}
        </nav>
      </>
    );
  }

  return (
    <aside style={{
      width:232,flexShrink:0,background:TOKENS.bg,
      borderRight:`0.5px solid ${TOKENS.hair}`,
      padding:'20px 14px',
      display:'flex',flexDirection:'column',gap:4,
      height:'100vh',position:'sticky',top:0,overflowY:'auto',
    }}>
      <SidebarContent/>
    </aside>
  );
}

  );
}

function Discover({ go, layout, voted, toggleVote, shortlisted, toggleShortlist, initialSector='All', onSectorChange }) {
  const IDEAS = useStartups();
  const [filter, setFilter] = React.useState('all');
  const [sort, setSort] = React.useState('trending');
  const [search, setSearch] = React.useState('');
  const [sectorFilter, setSectorFilter] = React.useState(initialSector);
  // sync when Homepage navigates with a pre-selected sector
  React.useEffect(() => { setSectorFilter(initialSector); }, [initialSector]);
  const isMobile = useMediaQuery('(max-width: 767px)');
  const effectiveLayout = isMobile ? 'feed' : layout;

  const ideas = React.useMemo(() => {
    let list = IDEAS;
    if (filter!=='all') list=list.filter(i=>i.stage===filter);
    if (sectorFilter!=='All') list=list.filter(i=>i.sector===sectorFilter);
    if (search) {
      const q=search.toLowerCase();
      list=list.filter(i=>i.name.toLowerCase().includes(q)||i.tagline.toLowerCase().includes(q)||i.sector.toLowerCase().includes(q));
    }
    list=[...list];
    if (sort==='trending') list.sort((a,b)=>b.upvotes-a.upvotes);
    if (sort==='new') list.reverse();
    if (sort==='closing') list.sort((a,b)=>(a.raise?.daysLeft??999)-(b.raise?.daysLeft??999));
    if (sort==='raised') list.sort((a,b)=>(b.raise?.raised??0)-(a.raise?.raised??0));
    return list;
  }, [filter, sort, search, sectorFilter]);

  const featuredIdea = IDEAS.find(i=>i.id==='glyph');

  return (
    <div>
      {effectiveLayout==='editorial' && filter!=='Concept' && !search && sectorFilter==='All' && (
        <div style={{
          marginBottom:32,padding:isMobile?'24px 20px':'36px',
          background:'linear-gradient(180deg,#ece8de 0%,#f6f4ef 100%)',
          border:`0.5px solid ${TOKENS.hair}`,borderRadius:16,
          display:'grid',gridTemplateColumns:isMobile?'1fr':'1.2fr 1fr',gap:isMobile?24:36,alignItems:'center',
        }}>
          <div>
            <Pill tone="closing" dot style={{marginBottom:14}}>Closing in {featuredIdea.raise.daysLeft}d</Pill>
            <h1 style={{fontFamily:SERIF,fontSize:isMobile?30:38,fontWeight:500,color:TOKENS.ink,margin:'0 0 12px',letterSpacing:'-0.015em',lineHeight:1.1}}>{featuredIdea.name}</h1>
            <p style={{fontFamily:SERIF,fontSize:isMobile?16:19,color:TOKENS.ink2,margin:'0 0 20px',lineHeight:1.4}}>{featuredIdea.tagline}. {featuredIdea.summary}</p>
            <div style={{display:'flex',alignItems:'center',gap:isMobile?16:24,marginBottom:22,flexWrap:'wrap'}}>
              {featuredIdea.metrics.slice(0,3).map((m,i)=><Stat key={i} {...m}/>)}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
              <Btn variant="raise" onClick={()=>go('idea/'+featuredIdea.id)}>Read raise · {fmtMoney(featuredIdea.raise.target)}</Btn>
              <Btn variant="ghost" onClick={()=>go('idea/'+featuredIdea.id)}>View deck {Icon.arrow(12)}</Btn>
            </div>
          </div>
          {!isMobile && <CoverArt tone={featuredIdea.coverTone} height={280} label="Editor's pick · this week"/>}
        </div>
      )}

      <FilterBar filter={filter} setFilter={setFilter} sort={sort} setSort={setSort} search={search} setSearch={setSearch} sectorFilter={sectorFilter} setSectorFilter={setSectorFilter}/>

      {ideas.length===0 && (
        <EmptyState icon={Icon.search(24)} title="No ideas found" body="Try clearing your filters or searching something else." cta="Clear filters" onCta={()=>{ setFilter('all'); setSearch(''); setSectorFilter('All'); }}/>
      )}

      {effectiveLayout==='editorial' && ideas.length>0 && (
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:22}}>
          {ideas.map((i,idx)=>(
            <EditorialCard key={i.id} idea={i} animDelay={idx*50} onOpen={()=>go('idea/'+i.id)} onVote={()=>toggleVote(i.id)} voted={voted[i.id]} onShortlist={()=>toggleShortlist(i.id)} shortlisted={shortlisted[i.id]}/>
          ))}
        </div>
      )}

      {effectiveLayout==='grid' && ideas.length>0 && (
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:18}}>
          {ideas.map((i,idx)=>(
            <GridCard key={i.id} idea={i} animDelay={idx*40} onOpen={()=>go('idea/'+i.id)} onVote={()=>toggleVote(i.id)} voted={voted[i.id]}/>
          ))}
        </div>
      )}

      {effectiveLayout==='feed' && ideas.length>0 && (
        <Card style={{overflow:'hidden'}}>
          {ideas.map((i,idx)=>(
            <FeedRow key={i.id} idea={i} rank={idx+1} onOpen={()=>go('idea/'+i.id)} onVote={()=>toggleVote(i.id)} voted={voted[i.id]}/>
          ))}
        </Card>
      )}
    </div>
  );
}

function FounderOnboard({ go }) {
  const isMobile   = useMediaQuery('(max-width: 767px)');
  const toast      = useToast();
  const [step, setStep]     = React.useState(0);
  const [submitting, setSub] = React.useState(false);
  const [fieldErrors, setFE] = React.useState({});
  const [form, setForm] = React.useState({
    // Step 0 — Identity
    firstName:'', lastName:'', founderCountry:'India',
    // Step 1 — Idea basics
    name:'', tagline:'', sector:'', stage:'Raise', summary:'', traction:'', geo:'',
    // Step 3 — Raise terms
    target:500000, minTicket:25000,
  });
  const upd = (k,v) => { setForm(f=>({...f,[k]:v})); setFE(e=>({...e,[k]:undefined})); };
  const steps = ['Identity & KYC','Idea basics','Materials','Raise terms','Review'];
  const back = () => setStep(s=>Math.max(0,s-1));

  // Validate current step before advancing
  const validateStep = () => {
    const e = {};
    if (step===0) {
      if (!form.firstName.trim())     e.firstName     = 'First name is required.';
      if (!form.lastName.trim())      e.lastName      = 'Last name is required.';
      if (!form.founderCountry || !COUNTRIES.includes(form.founderCountry)) e.founderCountry = 'Please select a valid country.';
    }
    if (step===1) {
      if (!form.name.trim())    e.name    = 'Project name is required.';
      if (!form.tagline.trim()) e.tagline = 'A one-line tagline is required.';
      if (!form.sector.trim())  e.sector  = 'Sector is required.';
      if (!form.summary.trim()) e.summary = 'A project summary is required.';
      if (!form.geo.trim())     e.geo     = 'Location is required.';
    }
    if (step===3) {
      if (!form.target || Number(form.target) < 100000) e.target = 'Raise target must be at least ₹1L.';
      if (!form.minTicket || Number(form.minTicket) < 5000) e.minTicket = 'Minimum ticket must be at least ₹5k.';
    }
    setFE(e);
    return Object.keys(e).length === 0;
  };

  const next = () => {
    if (!validateStep()) return;
    setStep(s=>Math.min(steps.length-1,s+1));
  };

  const submit = async () => {
    if (!form.name.trim()) { toast('Please complete the idea details before submitting.','error'); setStep(1); return; }
    setSub(true);
    try {
      if (window.sbClient) {
        const { data: { user: cu } } = await window.sbClient.auth.getUser();
        if (cu) {
          await window.sbClient.from('startups').insert({
            name:         form.name.trim(),
            tagline:      form.tagline.trim(),
            sector:       form.sector.trim(),
            stage:        form.stage,
            summary:      form.summary.trim(),
            traction:     form.traction.trim(),
            geo:          form.geo.trim(),
            founder_id:   cu.id,
            status:       'pending_review',
            votes:        0,
            raise_target:     Number(form.target),
            raise_min_ticket: Number(form.minTicket),
            raise_valuation:  '₹5Cr cap',
            raise_committed:  0,
            raise_investors:  0,
            raise_days_left:  60,
            tags:         [],
            created_at:   new Date().toISOString(),
          });
        }
      }
      toast(`"${form.name}" submitted! We'll review within 48 hours.`, 'success', 5000);
      go('founder-dashboard');
    } catch(err) {
      toast('Submission failed: ' + (err.message||'Unknown error'), 'error');
    } finally {
      setSub(false);
    }
  };

          {step===1&&'A clean elevator pitch beats a long deck. We\'ll show this in Discover.'}
          {step===2&&'Add deck, demo, founder video, and traction proof. Skip what you don\'t have.'}
          {step===3&&'Set the legal structure of your raise. We default to a SAFE.'}
          {step===4&&'Review and submit. We\'ll review within 48h before publishing.'}
        </p>
      </div>
      <StepIndicator steps={steps} current={step}/>
      <Card style={{padding:isMobile?24:32}}>
        {step===0 && (
          <div style={{display:'flex',flexDirection:'column',gap:20}}>
            <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:16}}>
              <Field label="Legal first name" required>
                <Input placeholder="As on your Aadhaar / Passport" full
                  value={form.firstName} onChange={v=>upd('firstName',v)}
                  style={fieldErrors.firstName?{border:`0.5px solid ${TOKENS.closing}`}:{}}/>
                {fieldErrors.firstName && <div style={{fontFamily:SANS,fontSize:11,color:TOKENS.closing,marginTop:3}}>{fieldErrors.firstName}</div>}
              </Field>
              <Field label="Legal last name" required>
                <Input placeholder="As on your Aadhaar / Passport" full
                  value={form.lastName} onChange={v=>upd('lastName',v)}

              </Field>

function InvestorOnboard({ go }) {
  const isMobile = useMediaQuery('(max-width: 767px)');
  const [step, setStep] = React.useState(0);
  const [accred, setAccred] = React.useState(null);
  const steps = ['Account','Identity','Suitability','Done'];

  // ── Form state ──────────────────────────────────────────────────────────────
  const [form, setForm] = React.useState({
    name:'', email:'', country:'India', password:'',
    pan:'', income:'', netWorth:'',
  });
  const [errors, setErrors] = React.useState({});
  const setField = (k, v) => {
    setForm(f => ({ ...f, [k]: v }));
    setErrors(e => ({ ...e, [k]: undefined }));
  };

  // ── PAN masking (AAAAA0000A) ─────────────────────────────────────────────────
  // As user types we uppercase + strip non-alphanumeric and cap at 10 chars
  const handlePAN = (raw) => {
    const clean = raw.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10);
    setField('pan', clean);
  };
  // Display with mask: first 5 letters, 4 digits, 1 letter
  const panDisplay = (v) => {
    if (!v) return '';
    // show full while editing; just return as-is (we validate on submit)
    return v;
  };

  // ── SEBI angel cap calculation ────────────────────────────────────────────────
  // Retail: lower of ₹25L and max(10% of income, 10% of net worth)
  // Accredited / entity: no statutory cap
  const income   = parseFloat((form.income   || '0').replace(/,/g,'')) || 0;
  const netWorth = parseFloat((form.netWorth || '0').replace(/,/g,'')) || 0;
  const sebiCap  = React.useMemo(() => {
    if (accred !== 'retail') return null;
    if (!income && !netWorth) return null;
    const cap = Math.min(2500000, Math.max(income * 0.1, netWorth * 0.1));
    return cap > 0 ? cap : null;
  }, [accred, income, netWorth]);

  // ── Validation per step ───────────────────────────────────────────────────────
  const validateStep = () => {
    const errs = {};
    if (step === 0) {
      if (!form.name.trim()) errs.name = 'Full name is required';
      if (!form.email.trim()) errs.email = 'Email is required';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) errs.email = 'Enter a valid email address';
      if (!form.country || !COUNTRIES.includes(form.country)) errs.country = 'Please select a valid country';
      if (!form.password) errs.password = 'Password is required';
      else if (form.password.length < 8) errs.password = 'Password must be at least 8 characters';
      else if (!/[A-Z]/.test(form.password) || !/[0-9]/.test(form.password))
        errs.password = 'Include at least one uppercase letter and one number';
    }
    if (step === 1) {
      if (!form.pan.trim()) errs.pan = 'PAN number is required';
      else if (!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(form.pan))
        errs.pan = 'Enter a valid PAN (e.g. ABCDE1234F)';
    }
    if (step === 2) {
      if (!accred) errs.accred = 'Please select your investor type';
      if (accred === 'retail') {
        const inc = parseFloat((form.income||'0').replace(/,/g,'')) || 0;
        const nw  = parseFloat((form.netWorth||'0').replace(/,/g,'')) || 0;
        if (inc < 250000) errs.income = 'Annual income must be at least ₹2.5L';
        if (nw  < 1000000) errs.netWorth = 'Net worth must be at least ₹10L';
      }
      if (accred === 'accredited') {
        const inc = parseFloat((form.income||'0').replace(/,/g,'')) || 0;
        const nw  = parseFloat((form.netWorth||'0').replace(/,/g,'')) || 0;
        if (inc < 2500000 && nw < 10000000) errs.income = 'Accredited investors need ₹25L+ income or ₹1Cr+ net worth';
      }
    }
    setErrors(errs);
    return Object.keys(errs).length === 0;
  };

  const handleContinue = () => {
    if (validateStep()) setStep(s => s + 1);
  };

  // ── Error message helper ──────────────────────────────────────────────────────
  const ErrMsg = ({ k }) => errors[k]
    ? <div style={{fontFamily:SANS,fontSize:11,color:'#c0392b',marginTop:4}}>{errors[k]}</div>
    : null;

  return (
    <div style={{maxWidth:640,margin:'0 auto'}}>
      <div style={{marginBottom:28}}>
        <Pill tone="raise" dot style={{marginBottom:12}}>Investor onboarding</Pill>
        <h1 style={{fontFamily:SERIF,fontSize:isMobile?26:36,fontWeight:500,margin:0,letterSpacing:'-0.015em'}}>
          {step===0&&'Open your investor account'}
          {step===1&&'Verify your identity'}
          {step===2&&'Tell us how you invest'}
          {step===3&&"You're in."}
        </h1>
        <p style={{fontFamily:SERIF,fontSize:16,color:TOKENS.ink2,marginTop:8,lineHeight:1.5}}>
          {step===0&&'Browsing & community is free forever. Investing requires a verified account.'}
          {step===1&&'Same KYC every regulated platform requires. Encrypted, never shared.'}
          {step===2&&'This determines what you can invest in and how much under SEBI AIF guidelines.'}
          {step===3&&'Welcome to Backable. Some featured raises to get you started.'}
        </p>
      </div>
      <StepIndicator steps={steps} current={step}/>
      <Card style={{padding:isMobile?24:32}}>

        {/* ── Step 0: Account ───────────────────────────────────────────────── */}
        {step===0 && (
          <div style={{display:'flex',flexDirection:'column',gap:18}}>
            <Field label="Full name" required>
              <Input placeholder="As on your Aadhaar / PAN" full
                value={form.name}
                onChange={v=>setField('name',v)}
                style={errors.name?{borderColor:'#c0392b'}:{}}/>
              <ErrMsg k="name"/>
            </Field>
            <Field label="Email" required>
              <Input placeholder="you@domain.com" full
                value={form.email}
                onChange={v=>setField('email',v)}
                style={errors.email?{borderColor:'#c0392b'}:{}}/>
              <ErrMsg k="email"/>
            </Field>
            <Field label="Country of residence" required hint="We onboard investors across India and globally.">
              <CountrySelect
                value={form.country}
                onChange={v=>setField('country',v)}
                error={!!errors.country}/>
              <ErrMsg k="country"/>
            </Field>
            <Field label="Password" required hint="Min 8 characters · at least one uppercase letter and one number">
              <Input placeholder="••••••••" type="password" full
                value={form.password}
                onChange={v=>setField('password',v)}
                style={errors.password?{borderColor:'#c0392b'}:{}}/>
              <ErrMsg k="password"/>
            </Field>
            <div style={{padding:14,background:'#efece4',borderRadius:8,fontFamily:SANS,fontSize:12,color:TOKENS.ink2,lineHeight:1.5}}>
              By continuing you agree to our <u>Terms</u>, <u>Privacy Policy</u>, and <u>Investor Education</u> module. Equity investing is high-risk; you can lose your entire investment.
            </div>
          </div>
        )}

        {/* ── Step 1: Identity ─────────────────────────────────────────────── */}
        {step===1 && (
          <div style={{display:'flex',flexDirection:'column',gap:18}}>
            <Field label="Government ID" required>
              <UploadTile title="Upload Aadhaar / Passport" sub="Front & back · encrypted in transit"/>
            </Field>
            <Field label="Proof of address" required hint="Utility bill or bank statement, last 90 days.">
              <UploadTile title="Upload statement" sub="PDF or image"/>
            </Field>
            <Field label="PAN Card Number" required hint="Permanent Account Number — format ABCDE1234F">
              <Input placeholder="ABCDE1234F" full
                value={panDisplay(form.pan)}
                onChange={v=>handlePAN(v)}
                style={{letterSpacing:'0.12em', fontFamily:MONO||SANS, textTransform:'uppercase', ...(errors.pan?{borderColor:'#c0392b'}:{})}}
                maxLength={10}/>
              <ErrMsg k="pan"/>
              {form.pan.length===10 && !errors.pan && (
                <div style={{fontFamily:SANS,fontSize:11,color:TOKENS.raise,marginTop:4,display:'flex',alignItems:'center',gap:4}}>
                  {Icon.check(11)} PAN format looks valid
                </div>
              )}
            </Field>
            <div style={{padding:14,background:TOKENS.warnBg,borderRadius:8,fontFamily:SANS,fontSize:12,color:TOKENS.warn,lineHeight:1.5}}>
              <b>Why we ask:</b> AML/KYC required by FIU-IND and SEBI. Your PAN is verified against NSDL records — typically clears in under 5 minutes.
            </div>
          </div>
        )}

        {/* ── Step 2: Suitability ──────────────────────────────────────────── */}
        {step===2 && (
          <div style={{display:'flex',flexDirection:'column',gap:18}}>
            <Field label="Investor type" required>
              <div style={{display:'grid',gap:10}}>
                {[
                  { id:'retail',     t:'Retail investor',    s:'Investment cap based on income & net worth per SEBI guidelines' },
                  { id:'accredited', t:'Accredited investor', s:'₹25L+ annual income OR ₹1Cr+ net worth' },
                  { id:'entity',     t:'Entity / AIF',        s:'Company, fund, family office · additional docs required' },
                ].map(o=>{
                  const sel=accred===o.id;
                  return (
                    <button key={o.id} onClick={()=>{setAccred(o.id);setErrors(e=>({...e,accred:undefined}));}}
                      style={{display:'flex',alignItems:'center',gap:14,padding:16,borderRadius:10,textAlign:'left',
                        border:`0.5px solid ${sel?TOKENS.ink:(errors.accred?'#c0392b':TOKENS.hair)}`,
                        background:sel?'#efece4':TOKENS.surface,cursor:'pointer'}}>
                      <div style={{width:18,height:18,borderRadius:999,border:`1.5px solid ${sel?TOKENS.ink:TOKENS.ink4}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                        {sel && <div style={{width:8,height:8,borderRadius:999,background:TOKENS.ink}}/>}
                      </div>
                      <div style={{flex:1}}>
                        <div style={{fontFamily:SANS,fontSize:14,fontWeight:500,color:TOKENS.ink}}>{o.t}</div>
                        <div style={{fontFamily:SANS,fontSize:12,color:TOKENS.ink3,marginTop:2}}>{o.s}</div>
                      </div>
                    </button>
                  );
                })}
              </div>
              <ErrMsg k="accred"/>
            </Field>
            <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:14}}>
              <Field label="Annual income (₹)" hint="Enter amount in rupees (e.g. 1500000)">
                <Input placeholder="e.g. 15,00,000" full
                  value={form.income}
                  onChange={v=>setField('income',v)}
                  style={errors.income?{borderColor:'#c0392b'}:{}}/>
                <ErrMsg k="income"/>
              </Field>
              <Field label="Net worth (₹)" hint="All assets minus liabilities">
                <Input placeholder="e.g. 50,00,000" full
                  value={form.netWorth}
                  onChange={v=>setField('netWorth',v)}
                  style={errors.netWorth?{borderColor:'#c0392b'}:{}}/>
                <ErrMsg k="netWorth"/>
              </Field>
            </div>
            {accred==='retail' && sebiCap && (
              <div style={{padding:14,background:TOKENS.raiseBg,borderRadius:8,fontFamily:SANS,fontSize:12,color:TOKENS.raise,lineHeight:1.5}}>
                Based on your inputs you can invest up to <b>{fmtMoney(sebiCap)} across all platforms</b> in the next 12 months (SEBI guideline: lower of ₹25L and 10% of income/net worth).
              </div>
            )}
            {accred==='retail' && !sebiCap && income===0 && netWorth===0 && (
              <div style={{padding:14,background:'#efece4',borderRadius:8,fontFamily:SANS,fontSize:12,color:TOKENS.ink2,lineHeight:1.5}}>
                Enter your income and net worth above to see your personalised investment cap.
              </div>
            )}
            {accred==='accredited' && (
              <div style={{padding:14,background:TOKENS.raiseBg,borderRadius:8,fontFamily:SANS,fontSize:12,color:TOKENS.raise,lineHeight:1.5}}>
                Accredited investors have <b>no statutory annual cap</b> on equity investments per SEBI regulations.
              </div>
            )}
            {accred==='entity' && (
              <div style={{padding:14,background:TOKENS.raiseBg,borderRadius:8,fontFamily:SANS,fontSize:12,color:TOKENS.raise,lineHeight:1.5}}>
                Entity accounts are reviewed individually. A Backable compliance officer will contact you within 2 business days.
              </div>
            )}
          </div>
        )}

        {/* ── Step 3: Done ─────────────────────────────────────────────────── */}
        {step===3 && (
          <div style={{textAlign:'center',padding:'20px 0'}}>
            <div style={{width:64,height:64,borderRadius:999,background:TOKENS.raiseBg,color:TOKENS.raise,display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:18}}>{Icon.check(28)}</div>
            <p style={{fontFamily:SERIF,fontSize:16,color:TOKENS.ink2,lineHeight:1.5,margin:'0 0 8px'}}>
              You're verified and ready to invest.
            </p>
            {accred==='retail' && sebiCap && (
              <p style={{fontFamily:SANS,fontSize:13,color:TOKENS.ink3,margin:'0 0 16px'}}>
                Annual investment cap: <b style={{color:TOKENS.ink}}>{fmtMoney(sebiCap)}</b>
              </p>
            )}
            {accred==='accredited' && (
              <p style={{fontFamily:SANS,fontSize:13,color:TOKENS.ink3,margin:'0 0 16px'}}>
                Status: <b style={{color:TOKENS.ink}}>Accredited investor</b> · No annual cap
              </p>
            )}
            {accred==='entity' && (
              <p style={{fontFamily:SANS,fontSize:13,color:TOKENS.ink3,margin:'0 0 16px'}}>
                Status: <b style={{color:TOKENS.ink}}>Entity / AIF</b> · Under review
              </p>
            )}
            <Btn variant="primary" size="lg" style={{marginTop:8}} onClick={()=>go('discover')}>Browse open raises {Icon.arrow(12)}</Btn>
          </div>
        )}

        {/* ── Navigation ───────────────────────────────────────────────────── */}
        {step<3 && (
          <div style={{display:'flex',justifyContent:'space-between',marginTop:28,paddingTop:24,borderTop:`0.5px solid ${TOKENS.hair}`,flexWrap:'wrap',gap:12}}>
            <Btn variant="ghost" onClick={()=>step===0?go('discover'):setStep(step-1)}>{step===0?'Cancel':'Back'}</Btn>
            <Btn variant="primary" onClick={handleContinue}>Continue {Icon.arrow(12)}</Btn>
          </div>
        )}
      </Card>
    </div>
  );
}

// ─── Responsive portfolio chart (U02) ────────────────────────────────────────
// Pure SVG bar chart — no external lib needed, responsive via viewBox
function PortfolioChart({ data }) {
  const [containerWidth, setContainerWidth] = React.useState(600);
  const ref = React.useRef(null);

  React.useEffect(() => {
    if (!ref.current) return;
    const ro = new ResizeObserver(entries => {
      const w = entries[0]?.contentRect.width;
      if (w) setContainerWidth(w);
    });
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);

  const H = 180, PAD_L = 48, PAD_R = 16, PAD_T = 20, PAD_B = 40;
  const W = containerWidth;
  const chartW = W - PAD_L - PAD_R;
  const chartH = H - PAD_T - PAD_B;
  const maxVal = Math.max(...data.map(d => Math.max(d.invested, d.current)), 1);
  const barW   = Math.max(14, Math.floor(chartW / data.length * 0.35));
  const gap    = chartW / data.length;

  const yLines = [0, 0.25, 0.5, 0.75, 1];

  return (
    <div ref={ref} style={{width:'100%', overflowX:'hidden'}}>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:'block'}}>
        {/* Y grid lines */}
        {yLines.map(pct => {
          const y = PAD_T + chartH * (1 - pct);
          const label = fmtMoney(Math.round(maxVal * pct));
          return (
            <g key={pct}>
              <line x1={PAD_L} y1={y} x2={W - PAD_R} y2={y}
                stroke={TOKENS.hair} strokeWidth="0.5" strokeDasharray="3,3"/>
              <text x={PAD_L - 6} y={y + 4} textAnchor="end"
                fontFamily={MONO} fontSize="9" fill={TOKENS.ink4}>{label}</text>
            </g>
          );
        })}
        {/* Bars */}
        {data.map((d, i) => {
          const cx       = PAD_L + gap * i + gap / 2;
          const hInvest  = (d.invested / maxVal) * chartH;
          const hCurrent = (d.current  / maxVal) * chartH;
          const yInvest  = PAD_T + chartH - hInvest;
          const yCurrent = PAD_T + chartH - hCurrent;
          const isDown   = d.current < d.invested;
          const isFlat   = d.current === 0;
          const barColor = isFlat ? TOKENS.closing : (isDown ? TOKENS.warn : TOKENS.raise);

          return (
            <g key={d.id}>
              {/* Invested bar (lighter) */}
              <rect x={cx - barW} y={yInvest} width={barW - 2} height={hInvest}
                fill={TOKENS.ink4} rx="3" opacity="0.5"/>
              {/* Current bar */}
              {d.current > 0 && (
                <rect x={cx + 2} y={yCurrent} width={barW - 2} height={hCurrent}
                  fill={barColor} rx="3"/>
              )}
              {/* X label — truncated on narrow screens */}
              <text x={cx} y={H - 6} textAnchor="middle"
                fontFamily={SANS} fontSize={containerWidth < 400 ? '8' : '10'}
                fill={TOKENS.ink3} clipPath={`url(#clip-${i})`}>
                {d.name.length > 8 ? d.name.slice(0,7)+'…' : d.name}
              </text>
            </g>
          );
        })}
        {/* Legend */}
        <g transform={`translate(${PAD_L},${H - 2})`}>
          <rect x="0" y="-10" width="8" height="8" fill={TOKENS.ink4} rx="2" opacity="0.5"/>
          <text x="11" y="-3" fontFamily={SANS} fontSize="9" fill={TOKENS.ink4}>Invested</text>
          <rect x="54" y="-10" width="8" height="8" fill={TOKENS.raise} rx="2"/>
          <text x="65" y="-3" fontFamily={SANS} fontSize="9" fill={TOKENS.ink3}>Current value</text>
        </g>
      </svg>
    </div>
  );
}

function CommitModal({ idea, amount: initialAmount, onClose }) {
  const [step,       setStep]       = React.useState(0);
  const [signing,    setSigning]    = React.useState(false);
  const [signErr,    setSignErr]    = React.useState('');
  const [signName,   setSignName]   = React.useState('');
  const [signNameErr,setSignNameErr]= React.useState('');
  const toast = useToast();
  const [upiId, setUpiId] = React.useState('');
  if (!idea) return null;
  // Use the amount chosen by the user in InvestPanel, fallback to min ticket
  const commitAmount = initialAmount || idea.raise?.minTicket || 100000;
  const formatInr = (n) => '₹' + Number(n).toLocaleString('en-IN');

  const handleSign = async () => {
    // Validate the legal name field before signing
    if (!signName.trim()) { setSignNameErr('Please type your full legal name to sign.'); return; }
    if (signName.trim().split(' ').length < 2) { setSignNameErr('Enter your full name (first and last).'); return; }
    setSignNameErr('');
    setSigning(true); setSignErr('');
    try {
      if (window.sbClient) {
        const { data: { user: cu } } = await window.sbClient.auth.getUser();
        if (cu) {
          await window.sbClient.from('commitments').insert({
            startup_id:  idea.id,
            investor_id: cu.id,        // matches SQL schema column name
            amount:      commitAmount,
            currency:    'INR',
            instrument:  'iSAFE',
            status:      'pending_payment',
            created_at:  new Date().toISOString(),
          });
          // Update raise counters (best-effort)
          window.sbClient.rpc('increment_raise', { startup_id: idea.id, amount: 100000 }).catch(()=>{});
        }
      }
      setStep(2); // advance to UPI payment step
    } catch(err) {
      // Still advance — don't block on DB errors; log for ops
      console.warn('Commitment write failed:', err.message);
      setStep(2);
    } finally {
      setSigning(false);
    }
  };
  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,zIndex:1000,background:'rgba(20,18,12,0.45)',backdropFilter:'blur(4px)',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div onClick={(e)=>e.stopPropagation()} style={{width:'100%',maxWidth:520,background:TOKENS.surface,borderRadius:16,border:`0.5px solid ${TOKENS.hair}`,boxShadow:'0 20px 60px rgba(20,18,12,0.25)',overflow:'hidden'}}>
        <div style={{padding:'22px 28px',borderBottom:`0.5px solid ${TOKENS.hair}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div>
            <div style={{fontFamily:MONO,fontSize:10,letterSpacing:'0.12em',textTransform:'uppercase',color:TOKENS.ink3,marginBottom:2}}>Commit · {idea.name}</div>
            <div style={{fontFamily:SERIF,fontSize:20,fontWeight:500,color:TOKENS.ink}}>
              {step===0&&'Review your commitment'}
              {step===1&&'Sign the SAFE'}
              {step===2&&'Pay via UPI'}
              {step===3&&"You're in"}
            </div>
          </div>
          <button onClick={onClose} style={{width:32,height:32,borderRadius:8,border:`0.5px solid ${TOKENS.hair}`,background:TOKENS.surface,cursor:'pointer',color:TOKENS.ink3,fontSize:18,lineHeight:1,display:'flex',alignItems:'center',justifyContent:'center'}}>{Icon.close(14)}</button>
        </div>
        <div style={{padding:28}}>
          {step===0 && (
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              {[
                ['Investing in',    idea.name],
                ['Instrument',      `Post-money SAFE · ${idea.raise?.valuation||'₹5Cr cap'}`],
                ['Amount',          formatInr(commitAmount)],
                ['SEBI framework',  'Angel Investor · DPIIT-recognised startup'],
                ['Escrow by',       'Razorpay Escrow (RBI-regulated)'],
                ['Refundable until','48h before close'],
              ].map(([k,v],i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:i<5?`0.5px solid ${TOKENS.hair}`:'none'}}>
                  <span style={{fontFamily:SANS,fontSize:12,color:TOKENS.ink3}}>{k}</span>
                  <span style={{fontFamily:SANS,fontSize:13,color:TOKENS.ink,fontWeight:500}}>{v}</span>
                </div>
              ))}
              <div style={{padding:14,background:TOKENS.warnBg,borderRadius:8,fontFamily:SANS,fontSize:12,color:TOKENS.warn,lineHeight:1.5}}>
                Equity investments are high-risk and illiquid. This is not a public offer. You may lose your entire investment. Consult a SEBI-registered advisor before investing.
              </div>
            </div>
          )}
          {step===1 && (
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              <div style={{height:200,background:TOKENS.bg,borderRadius:8,padding:16,fontFamily:SERIF,fontSize:12,color:TOKENS.ink2,lineHeight:1.5,overflow:'auto'}}>
                <p style={{margin:0}}><b>SIMPLE AGREEMENT FOR FUTURE EQUITY</b></p>
                <p>This certifies that in exchange for the payment by the Investor of {formatInr(commitAmount)} (the "Purchase Amount"), {idea.name} (the "Company"), a company incorporated in India, hereby issues to the Investor the right to certain shares of the Company's capital stock…</p>
                <p>1. <b>Events.</b> Equity Financing. If there is an Equity Financing before the termination of this Safe…</p>
                <p>2. <b>Definitions.</b> "Post-Money Valuation Cap" means {idea.raise?.valuation||'₹5Cr'}…</p>
                <p>3. <b>Governing Law.</b> This agreement shall be governed by the laws of India and disputes shall be subject to jurisdiction of courts in Mumbai, Maharashtra.</p>
              </div>
              <Field label="Type your full legal name to sign" required>
                <Input full placeholder="As per PAN card"
                  value={signName} onChange={v=>{ setSignName(v); setSignNameErr(''); }}
                  style={signNameErr?{borderColor:'#c0392b'}:{}}/>
                {signNameErr && <div style={{fontFamily:'sans-serif',fontSize:11,color:'#c0392b',marginTop:4}}>{signNameErr}</div>}
              </Field>
            </div>
          )}
          {step===2 && (
            <div style={{display:'flex',flexDirection:'column',gap:16}}>
              <div style={{padding:14,background:TOKENS.raiseBg,borderRadius:8,fontFamily:SANS,fontSize:13,color:TOKENS.raise,fontWeight:500,textAlign:'center'}}>
                Pay {formatInr(commitAmount)} via UPI to complete your commitment
              </div>
              {[
                { id:'upi', label:'UPI / BHIM / PhonePe / GPay', sub:'Enter your UPI ID', icon:'🇮🇳' },
                { id:'qr',  label:'Scan QR code',                sub:'Use any UPI app', icon:'⬜' },
              ].map(opt=>(
                <div key={opt.id} style={{padding:16,borderRadius:10,border:`0.5px solid ${TOKENS.hair}`,display:'flex',gap:12,alignItems:'flex-start',background:TOKENS.surface}}>
                  <span style={{fontSize:22}}>{opt.icon}</span>
                  <div style={{flex:1}}>
                    <div style={{fontFamily:SANS,fontSize:13,fontWeight:500,color:TOKENS.ink}}>{opt.label}</div>
                    <div style={{fontFamily:SANS,fontSize:11,color:TOKENS.ink3,marginBottom:opt.id==='upi'?8:0}}>{opt.sub}</div>
                    {opt.id==='upi'&&<Input value={upiId} onChange={setUpiId} placeholder="yourname@upi" full/>}
                    {opt.id==='qr'&&<div style={{width:80,height:80,background:'#f0f0f0',borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:SANS,fontSize:10,color:TOKENS.ink3,marginTop:4}}>QR code</div>}
                  </div>
                </div>
              ))}
            </div>
          )}
          {step===3 && (
            <div style={{textAlign:'center',padding:'14px 0'}}>
              <div style={{width:56,height:56,borderRadius:999,background:TOKENS.raiseBg,color:TOKENS.raise,display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:14}}>{Icon.check(24)}</div>
              <div style={{fontFamily:SERIF,fontSize:18,color:TOKENS.ink2,lineHeight:1.5}}>
                {formatInr(commitAmount)} committed to {idea.name}.<br/>Funds escrowed via Razorpay. We'll email you when the raise closes.
              </div>
            </div>
          )}
        </div>
        <div style={{padding:'16px 28px',borderTop:`0.5px solid ${TOKENS.hair}`,display:'flex',justifyContent:'space-between',background:TOKENS.bg}}>
          <Btn variant="ghost" onClick={onClose}>{step===3?'Close':'Cancel'}</Btn>
          {step===0 && <Btn variant="raise" onClick={()=>setStep(1)}>Continue to SAFE {Icon.arrow(12)}</Btn>}
          {step===1 && <Btn variant="raise" onClick={handleSign} disabled={signing}>{signing?<Spinner size={14} color="#fff"/>:'Sign & commit'} {!signing&&Icon.arrow(12)}</Btn>}
          {step===2 && <Btn variant="raise" onClick={()=>setStep(3)}>Confirm payment {Icon.arrow(12)}</Btn>}
        </div>
      </div>
    </div>
  );
}

function Notifications({ go }) {
  const IDEAS = useStartups();
  const isMobile = useMediaQuery('(max-width: 767px)');
  const [filter, setFilter] = React.useState('all');
  const [notifs, setNotifs] = React.useState(NOTIFICATIONS);

  const tabs = [
    { id:'all',        label:'All' },
    { id:'raise',      label:'Investments' },
    { id:'comment',    label:'Comments' },
    { id:'system',     label:'System' },
  ];

  const iconForType = (type) => {
    if (type==='raise')   return <div style={{width:32,height:32,borderRadius:999,background:TOKENS.raiseBg,color:TOKENS.raise,display:'flex',alignItems:'center',justifyContent:'center'}}>{Icon.chart(14)}</div>;
    if (type==='closing') return <div style={{width:32,height:32,borderRadius:999,background:TOKENS.closingBg,color:TOKENS.closing,display:'flex',alignItems:'center',justifyContent:'center'}}>{Icon.clock(14)}</div>;
    if (type==='comment') return <div style={{width:32,height:32,borderRadius:999,background:'#efece4',color:TOKENS.ink2,display:'flex',alignItems:'center',justifyContent:'center'}}>{Icon.comment(14)}</div>;
    if (type==='system')  return <div style={{width:32,height:32,borderRadius:999,background:TOKENS.blueBg,color:TOKENS.blue,display:'flex',alignItems:'center',justifyContent:'center'}}>{Icon.shield(14)}</div>;
    return <div style={{width:32,height:32,borderRadius:999,background:'#efece4',color:TOKENS.ink3,display:'flex',alignItems:'center',justifyContent:'center'}}>{Icon.bell(14)}</div>;
  };

  const filtered = filter==='all' ? notifs : notifs.filter(n=>n.type===filter||n.type==='closing'&&filter==='raise');
  const unreadCount = notifs.filter(n=>n.unread).length;

  const markAllRead = () => setNotifs(ns=>ns.map(n=>({...n,unread:false})));

  return (
    <div style={{maxWidth:680}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20,flexWrap:'wrap',gap:12}}>
        <div style={{display:'flex',gap:0,borderBottom:`0.5px solid ${TOKENS.hair}`,flex:1}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>setFilter(t.id)} style={{
              padding:'10px 16px',border:0,background:'transparent',cursor:'pointer',
              fontFamily:SANS,fontSize:13,fontWeight:filter===t.id?500:400,
              color:filter===t.id?TOKENS.ink:TOKENS.ink3,
              borderBottom:`2px solid ${filter===t.id?TOKENS.ink:'transparent'}`,
              marginBottom:-1,whiteSpace:'nowrap',transition:'all 120ms',
            }}>{t.label}</button>
          ))}
        </div>
        {unreadCount>0 && <button onClick={markAllRead} style={{border:0,background:'transparent',fontFamily:SANS,fontSize:12,color:TOKENS.ink3,cursor:'pointer',textDecoration:'underline',whiteSpace:'nowrap'}}>Mark all read</button>}
      </div>

      {filtered.length===0 ? (
        <EmptyState icon={Icon.bell(22)} title="All caught up" body="No notifications in this category."/>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:0}}>
          {filtered.map((n,i)=>(
            <div key={n.id} onClick={n.ideaId?()=>go('idea/'+n.ideaId):undefined} style={{
              display:'flex',gap:14,padding:'16px 18px',borderBottom:`0.5px solid ${TOKENS.hair}`,
              cursor:n.ideaId?'pointer':'default',
              background:n.unread?'rgba(31,93,58,0.03)':'transparent',
              transition:'background 120ms',borderRadius:i===0?'14px 14px 0 0':i===filtered.length-1?'0 0 14px 14px':'0',
            }}
              onMouseEnter={(e)=>n.ideaId&&(e.currentTarget.style.background=TOKENS.hair2)}
              onMouseLeave={(e)=>e.currentTarget.style.background=n.unread?'rgba(31,93,58,0.03)':'transparent'}
            >
              <div style={{flexShrink:0,marginTop:2}}>{iconForType(n.type)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontFamily:SANS,fontSize:13,color:TOKENS.ink,lineHeight:1.45,marginBottom:4}}>{n.body}</div>
                <div style={{fontFamily:SANS,fontSize:11,color:TOKENS.ink4}}>{n.when} ago{n.ideaId?` · ${IDEAS.find(i=>i.id===n.ideaId)?.name||''}`:''}</div>
              </div>
              {n.unread && <div style={{width:8,height:8,borderRadius:999,background:TOKENS.raise,flexShrink:0,marginTop:6}}/>}
              {n.ideaId && <div style={{color:TOKENS.ink4,display:'flex',alignItems:'center',flexShrink:0}}>{Icon.chevron(14,'right')}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ProfileSettings({ user }) {
  const isMobile = useMediaQuery('(max-width: 767px)');
  const toast = useToast();
  const [tab, setTab] = React.useState('profile');
  const [saving, setSaving] = React.useState(false);
  const [notifToggles, setNotifToggles] = React.useState({
    newComment:true, raiseUpdate:true, closingSoon:true, newInvestor:true, systemAlerts:true, weeklyDigest:false,
  });
  const toggleN = (k) => setNotifToggles(t=>({...t,[k]:!t[k]}));
  const handleSave = async () => {
    setSaving(true);
    await new Promise(r=>setTimeout(r,600)); // simulate save
    setSaving(false);
    toast('Profile saved successfully.', 'success', 3000);
  };

  const ToggleRow = ({ label, sub, k }) => (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 0',borderBottom:`0.5px solid ${TOKENS.hair}`}}>
      <div>
        <div style={{fontFamily:SANS,fontSize:13,fontWeight:500,color:TOKENS.ink}}>{label}</div>
        {sub && <div style={{fontFamily:SANS,fontSize:12,color:TOKENS.ink3,marginTop:2}}>{sub}</div>}
      </div>

function AdminModeration({ go }) {
  const IDEAS = useStartups();
  const isMobile = useMediaQuery('(max-width: 767px)');
  const [tab, setTab] = React.useState('pending');
  const [selected, setSelected] = React.useState(null);
  const [queue, setQueue] = React.useState(ADMIN_QUEUE);
  const [noteInput, setNoteInput] = React.useState('');

  const filtered = queue.filter(q=>q.status===tab);
  const pending  = queue.filter(q=>q.status==='pending').length;

  const approve = (id) => setQueue(q=>q.map(x=>x.id===id?{...x,status:'live'}:x));
  const reject  = (id) => setQueue(q=>q.map(x=>x.id===id?{...x,status:'rejected'}:x));

  const statusPill = (s) => {
    if (s==='pending') return <Pill tone="warn" dot>Pending</Pill>;
    if (s==='live')    return <Pill tone="raise" dot>Live</Pill>;
    if (s==='rejected')return <Pill tone="closing" dot>Rejected</Pill>;
    return null;
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:24}}>
      {/* Stats row */}
      <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr 1fr':'repeat(4,1fr)',gap:14}}>
        {[
          { k:'Pending review', v:String(pending), sub:'need action', accent:pending>0?TOKENS.warn:undefined },
          { k:'Approved today', v:'3', sub:'went live' },
          { k:'Rejected this week', v:'1', sub:'with notes' },
          { k:'Total live ideas', v:String(queue.filter(q=>q.status==='live').length), sub:'on platform' },
        ].map((s,i)=>(
          <Card key={i} style={{padding:20}}><Stat {...s}/></Card>
        ))}
      </div>

      {/* Tab bar */}
      <div style={{display:'flex',gap:0,borderBottom:`0.5px solid ${TOKENS.hair}`}}>
        {[
          { id:'pending',  label:`Pending (${pending})` },
          { id:'live',     label:'Live' },
          { id:'rejected', label:'Rejected' },
        ].map(t=>(
          <button key={t.id} onClick={()=>{ setTab(t.id); setSelected(null); }} style={{
            padding:'10px 18px',border:0,background:'transparent',cursor:'pointer',
            fontFamily:SANS,fontSize:13,fontWeight:tab===t.id?500:400,
            color:tab===t.id?TOKENS.ink:TOKENS.ink3,
            borderBottom:`2px solid ${tab===t.id?TOKENS.ink:'transparent'}`,
            marginBottom:-1,whiteSpace:'nowrap',transition:'all 120ms',
          }}>{t.label}</button>
        ))}
      </div>

      {filtered.length===0 ? (
        <EmptyState icon={Icon.check(22)} title={`No ${tab} submissions`} body={tab==='pending'?'All caught up — no ideas waiting for review.':'Nothing to show here.'}/>
      ) : (
        <div style={{display:'grid',gridTemplateColumns:selected&&!isMobile?'1fr 360px':'1fr',gap:24,alignItems:'start'}}>
          {/* Table */}
          <Card style={{overflow:'hidden'}}>
            {!isMobile && (
              <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr 1fr 120px',padding:'12px 20px',background:'#efece4',fontFamily:MONO,fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:TOKENS.ink3}}>
                <div>Idea</div><div>Founder</div><div>Type</div><div>Sector</div><div>Submitted</div><div>Actions</div>
              </div>
            )}
            {filtered.map((item,i)=>(
              <div key={item.id} onClick={()=>setSelected(selected?.id===item.id?null:item)} style={{
                display:isMobile?'block':'grid',
                gridTemplateColumns:'2fr 1fr 1fr 1fr 1fr 120px',
                padding:isMobile?'16px 18px':'16px 20px',
                borderTop:`0.5px solid ${TOKENS.hair}`,
                cursor:'pointer',transition:'background 120ms',
                background:selected?.id===item.id?TOKENS.hair2:'transparent',
              }}
                onMouseEnter={(e)=>selected?.id!==item.id&&(e.currentTarget.style.background=TOKENS.hair2)}
                onMouseLeave={(e)=>selected?.id!==item.id&&(e.currentTarget.style.background='transparent')}
              >
                {isMobile ? (
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12}}>
                    <div>
                      <div style={{fontFamily:SANS,fontSize:14,fontWeight:500,color:TOKENS.ink,marginBottom:4}}>{item.name}</div>
                      <div style={{fontFamily:SANS,fontSize:12,color:TOKENS.ink3}}>{item.founder} · {item.sector}</div>
                      <div style={{marginTop:8,display:'flex',gap:6,flexWrap:'wrap'}}>
                        {statusPill(item.status)}
                        <Pill tone="outline">{item.type}</Pill>
                        <Pill tone="outline">{item.submitted}</Pill>
                      </div>
                    </div>
                    {tab==='pending' && (
                      <div style={{display:'flex',flexDirection:'column',gap:6,flexShrink:0}}>
                        <Btn size="sm" variant="raise" onClick={(e)=>{e.stopPropagation();approve(item.id);}}>Approve</Btn>
                        <Btn size="sm" variant="danger" onClick={(e)=>{e.stopPropagation();reject(item.id);}}>Reject</Btn>
                      </div>
                    )}
                  </div>
                ) : (
                  <>
                    <div>
                      <div style={{fontFamily:SANS,fontSize:13,fontWeight:500,color:TOKENS.ink}}>{item.name}</div>
                      <div style={{display:'flex',gap:6,marginTop:4,flexWrap:'wrap'}}>
                        {statusPill(item.status)}
                        <span style={{fontFamily:MONO,fontSize:10,color:TOKENS.ink4}}>↑ {item.signal.toLocaleString()} signal</span>
                      </div>
                    </div>
                    <div style={{fontFamily:SANS,fontSize:13,color:TOKENS.ink2,display:'flex',alignItems:'center'}}>{item.founder}</div>
                    <div style={{display:'flex',alignItems:'center'}}><Pill tone="outline">{item.type}</Pill></div>
                    <div style={{fontFamily:SANS,fontSize:13,color:TOKENS.ink2,display:'flex',alignItems:'center'}}>{item.sector}</div>
                    <div style={{fontFamily:SANS,fontSize:13,color:TOKENS.ink3,display:'flex',alignItems:'center'}}>{item.submitted}</div>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      {tab==='pending' ? (
                        <>
                          <Btn size="sm" variant="raise" onClick={(e)=>{e.stopPropagation();approve(item.id);}}>Approve</Btn>
                          <Btn size="sm" variant="danger" onClick={(e)=>{e.stopPropagation();reject(item.id);}}>Reject</Btn>
                        </>
                      ) : (
                        <Btn size="sm" variant="ghost" onClick={(e)=>{e.stopPropagation();go('idea/'+IDEAS.find(x=>x.name===item.name)?.id||'discover')}}>View</Btn>
                      )}
                    </div>
                  </>
                )}
              </div>
            ))}
          </Card>

          {/* Detail panel */}
          {selected && (
            <Card style={{padding:24,position:isMobile?'static':'sticky',top:96}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
                <div style={{fontFamily:SERIF,fontSize:20,fontWeight:500,color:TOKENS.ink}}>{selected.name}</div>
                <button onClick={()=>setSelected(null)} style={{border:0,background:'transparent',color:TOKENS.ink3,cursor:'pointer',display:'flex',padding:4}}>{Icon.close(14)}</button>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:18}}>
                {[
                  ['Founder', selected.founder],
                  ['Type', selected.type],
                  ['Sector', selected.sector],
                  ['Submitted', selected.submitted],
                  ['Community signal', `${selected.signal.toLocaleString()} upvotes`],
                  ['Status', selected.status.charAt(0).toUpperCase()+selected.status.slice(1)],
                ].map(([k,v])=>(
                  <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:`0.5px solid ${TOKENS.hair}`}}>
                    <span style={{fontFamily:SANS,fontSize:12,color:TOKENS.ink3}}>{k}</span>
                    <span style={{fontFamily:SANS,fontSize:13,color:TOKENS.ink,fontWeight:500}}>{v}</span>
                  </div>
                ))}
              </div>
              <Field label="Internal notes">
                <TextArea value={selected.notes||noteInput} onChange={(v)=>setNoteInput(v)} rows={3} placeholder="Add moderation notes…"/>
              </Field>
              {tab==='pending' && (
                <div style={{display:'flex',gap:8,marginTop:16}}>
                  <Btn variant="raise" full onClick={()=>{approve(selected.id);setSelected(null);}}>Approve & publish</Btn>
                  <Btn variant="danger" onClick={()=>{reject(selected.id);setSelected(null);}}>Reject</Btn>
                </div>
              )}
              <Btn variant="ghost" size="sm" style={{marginTop:10,width:'100%'}} onClick={()=>go('discover')}>Request changes from founder</Btn>
            </Card>
          )}
        </div>
      )}
    </div>
  );
}

// ─── localStorage helpers (F04) ──────────────────────────────────────────────
function usePersisted(key, fallback) {
  const [value, setValue] = React.useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch { return fallback; }
  });
  const set = React.useCallback((updater) => {
    setValue(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
      return next;
    });
  }, [key]);
  return [value, set];
}

function BackableAssistant() {
  const [open,     setOpen]     = React.useState(false);
  const [messages, setMessages] = React.useState([
    { from:'bot', text:'Namaste! 👋 I\'m the Backable Assistant.\n\nI can help you with:\n• How the platform works\n• Listing your startup\n• Expressing interest\n• Pro features & pricing\n• SEBI / legal questions\n\nWhat would you like to know?' }
  ]);
  const [draft,    setDraft]    = React.useState('');
  const [typing,   setTyping]   = React.useState(false);
  const endRef = React.useRef(null);

  React.useEffect(() => { endRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages, open]);

  const getResponse = (input) => {
    const lower = input.toLowerCase();
    for (const kb of SUPPORT_KB) {
      if (kb.q.some(q => lower.includes(q))) return kb.a;
    }
    return `Thanks for your question! I didn't quite catch that 🤔\n\nYou can ask me about:\n• How Backable works\n• Listing a startup\n• Expressing interest in a startup\n• Pro plan & pricing\n• SEBI / legal rules\n• XP, badges & leaderboard\n\nFor anything else, email us at **support@backable.in** — we reply within 24 hours.`;
  };

  const send = async (overrideText) => {
    const text = (typeof overrideText === 'string' ? overrideText : draft).trim();
    if (!text) return;
    setMessages(m=>[...m, { from:'user', text }]);
    setDraft('');
    setTyping(true);
    await new Promise(r=>setTimeout(r,900+Math.random()*600));
    setTyping(false);
    setMessages(m=>[...m, { from:'bot', text:getResponse(text) }]);
  };

  const handleKey = (e) => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

  const QUICK = ['How does it work?','How to list startup?','Pro pricing?','SEBI rules?'];

  return (
    <>
      {/* Floating button */}
      <button onClick={()=>setOpen(o=>!o)} style={{
        position:'fixed',bottom:24,right:24,zIndex:900,
        width:52,height:52,borderRadius:26,
        background:open?TOKENS.ink:TOKENS.raise,
        border:'none',cursor:'pointer',
        display:'flex',alignItems:'center',justifyContent:'center',
        boxShadow:'0 4px 20px rgba(20,18,12,0.25)',
        transition:'all 200ms',
        color:'#fbfaf6',fontSize:22,
      }}>
        {open ? Icon.close(20) : '💬'}
        {!open && messages.length===1 && (
          <span style={{
            position:'absolute',top:0,right:0,width:14,height:14,
            borderRadius:7,background:'#ef4444',
            border:'2px solid white',
          }}/>
        )}
      </button>

      {/* Chat window */}
      {open && (
        <div style={{
          position:'fixed',bottom:86,right:24,zIndex:900,
          width:340,maxHeight:500,
          background:TOKENS.card,borderRadius:16,
          border:`0.5px solid ${TOKENS.hair}`,
          boxShadow:'0 8px 40px rgba(20,18,12,0.18)',
          display:'flex',flexDirection:'column',overflow:'hidden',
        }}>
          {/* Header */}
          <div style={{padding:'14px 16px',background:TOKENS.raise,display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:32,height:32,borderRadius:16,background:'rgba(255,255,255,0.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>🤖</div>
            <div style={{flex:1}}>
              <div style={{fontFamily:SANS,fontSize:13,fontWeight:600,color:'#fbfaf6'}}>Backable Assistant</div>
              <div style={{fontFamily:SANS,fontSize:10,color:'rgba(251,250,246,0.7)',display:'flex',alignItems:'center',gap:4}}>
                <span style={{width:5,height:5,borderRadius:3,background:'#86efac',display:'inline-block'}}/>
                Online · Typically replies instantly
              </div>
            </div>
          </div>

          {/* Messages */}
          <div style={{flex:1,overflowY:'auto',padding:'12px 14px',display:'flex',flexDirection:'column',gap:10,minHeight:0}}>
            {messages.map((msg,i)=>(
              <div key={i} style={{display:'flex',justifyContent:msg.from==='user'?'flex-end':'flex-start'}}>
                <div style={{
                  maxWidth:'85%',padding:'8px 12px',borderRadius:10,
                  background:msg.from==='user'?TOKENS.ink:'#f0ede6',
                  color:msg.from==='user'?'#fbfaf6':TOKENS.ink,
                  fontFamily:SANS,fontSize:12,lineHeight:1.6,
                  whiteSpace:'pre-wrap',wordBreak:'break-word',
                }}>{msg.text}</div>
              </div>
            ))}
            {typing && (
              <div style={{display:'flex',gap:4,padding:'8px 12px',background:'#f0ede6',borderRadius:10,width:'fit-content'}}>
                {[0,1,2].map(i=>(
                  <span key={i} style={{width:5,height:5,borderRadius:3,background:TOKENS.ink3,display:'inline-block',animation:`pulse-dot 1.2s ${i*0.2}s infinite`}}/>
                ))}
              </div>
            )}
            <div ref={endRef}/>
          </div>

          {/* Quick replies */}
          {messages.length<=2 && (
            <div style={{padding:'0 12px 10px',display:'flex',gap:6,flexWrap:'wrap'}}>
              {QUICK.map(q=>(
                <button key={q} onClick={()=>send(q)} style={{
                  padding:'4px 10px',borderRadius:20,border:`0.5px solid ${TOKENS.raise}`,
                  background:'transparent',color:TOKENS.raise,
                  fontFamily:SANS,fontSize:10,cursor:'pointer',
                }}>{q}</button>
              ))}
            </div>
          )}

          {/* Input */}
          <div style={{padding:'10px 12px',borderTop:`0.5px solid ${TOKENS.hair}`,display:'flex',gap:8}}>
            <input
              value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={handleKey}
              placeholder="Ask anything…"
              style={{flex:1,border:`0.5px solid ${TOKENS.hair}`,borderRadius:8,padding:'7px 10px',fontFamily:SANS,fontSize:12,color:TOKENS.ink,background:TOKENS.surface,outline:'none'}}

            }}>{Icon.arrow(12)}</button>
          </div>
        </div>
      )}
    </>
  );
}

function InterestModal({ idea, onClose, onSubmit }) {

  return (

              <Btn variant="raise" onClick={handleSend} disabled={!message.trim()} loading={sending} full>

              </Btn>
            </div>
          </>
        ) : (
          <div style={{textAlign:'center',padding:'20px 0'}}>
            <div style={{fontSize:48,marginBottom:16}}>🎯</div>
            <div style={{fontFamily:SERIF,fontSize:20,fontWeight:500,color:TOKENS.ink,marginBottom:8}}>Interest sent!</div>

            </div>
            <div style={{display:'inline-flex',alignItems:'center',gap:8,background:'#fefce8',border:'0.5px solid #fde68a',padding:'10px 18px',borderRadius:10,fontFamily:SANS,fontSize:13,color:'#92400e',marginBottom:24}}>

            </div>
            <Btn variant="primary" onClick={onClose} full>Done</Btn>
          </div>
        )}
      </Card>
    </div>
  );
}

// ── Chat Modal — activated after founder accepts interest ─────
function ChatModal({ idea, interestData, onClose }) {
  const [messages, setMessages] = React.useState([
    { from:'them', text:interestData?.message || "Hi! I'm really interested in what you're building.", time:'just now' }
  ]);
  const [draft, setDraft]       = React.useState('');
  const [meetSent, setMeetSent] = React.useState(false);
  const endRef = React.useRef(null);

  React.useEffect(() => { endRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages]);

  const send = () => {
    if (!draft.trim()) return;
    setMessages(m=>[...m, { from:'me', text:draft.trim(), time:'just now' }]);
    setDraft('');
  };

  const suggestMeeting = () => {
    setMessages(m=>[...m, {
      from:'me',
      text:'Would love to meet over chai and discuss this in person! Are you available this week?',
      time:'just now', isMeet:true
    }]);
    setMeetSent(true);
  };

  const handleKey = (e) => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <Card style={{width:'100%',maxWidth:480,padding:0,display:'flex',flexDirection:'column',maxHeight:'80vh'}} onClick={e=>e.stopPropagation()}>
        <div style={{padding:'14px 20px',borderBottom:`0.5px solid ${TOKENS.hair}`,display:'flex',alignItems:'center',gap:12}}>
          <div style={{flex:1,minWidth:0}}>

            <div style={{fontFamily:SANS,fontSize:11,color:TOKENS.raise,display:'flex',alignItems:'center',gap:4}}>
              <span style={{width:6,height:6,borderRadius:3,background:TOKENS.raise,display:'inline-block',animation:'pulse-dot 2s infinite'}}/>
