            <Btn variant="quiet" size="sm" onClick={suggestMeeting} icon={<span style={{fontSize:12}}>☕</span>}>

          )}
          <button onClick={onClose} style={{border:0,background:'transparent',cursor:'pointer',color:TOKENS.ink3,padding:4,display:'flex'}}>{Icon.close(16)}</button>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'16px 20px',display:'flex',flexDirection:'column',gap:10,minHeight:200}}>
          {messages.map((msg,i)=>(
            <div key={i} style={{display:'flex',justifyContent:msg.from==='me'?'flex-end':'flex-start'}}>
              <div style={{
                maxWidth:'80%',padding:'9px 13px',borderRadius:12,
                background:msg.isMeet?TOKENS.raiseBg:msg.from==='me'?TOKENS.ink:'#efece4',
                color:msg.isMeet?TOKENS.raise:msg.from==='me'?'#fbfaf6':TOKENS.ink,
                fontFamily:SANS,fontSize:13,lineHeight:1.5,
                border:msg.isMeet?`0.5px solid ${TOKENS.raise}`:'none',
              }}>
                {msg.isMeet && <div style={{fontSize:16,marginBottom:4}}>☕</div>}
                {msg.text}
                <div style={{fontSize:10,opacity:0.5,marginTop:4,textAlign:msg.from==='me'?'right':'left'}}>{msg.time}</div>
              </div>
            </div>
          ))}
          <div ref={endRef}/>
        </div>
        <div style={{padding:'12px 16px',borderTop:`0.5px solid ${TOKENS.hair}`,display:'flex',gap:8,alignItems:'center'}}>
          <div style={{flex:1,display:'flex',alignItems:'center',padding:'0 12px',height:36,background:TOKENS.surface,border:`0.5px solid ${TOKENS.hair}`,borderRadius:8}}>
            <input
              value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={handleKey}
              placeholder="Type a message…"
              style={{flex:1,border:0,outline:0,background:'transparent',fontFamily:SANS,fontSize:13,color:TOKENS.ink}}
            />
          </div>
          <Btn variant="primary" size="sm" onClick={send} disabled={!draft.trim()}>{Icon.arrow(12)}</Btn>
        </div>
      </Card>
    </div>
  );
}

// ── GamificationBar — shown in sidebar ───────────────────────
function GamificationBar({ xp=0, streak=0, badges=[] }) {
  const nextMilestone = [100,250,500,1000,2500].find(m=>m>xp) || 5000;
  const progress = Math.min((xp/nextMilestone)*100, 100);
  const earnedBadges = BADGES.filter(b=>badges.includes(b.id));

  return (
    <div style={{
      background:TOKENS.raiseBg,borderRadius:10,padding:'12px 14px',
      border:`0.5px solid ${TOKENS.raise}22`,margin:'8px 0',
    }}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div style={{display:'flex',alignItems:'center',gap:6,fontFamily:SANS,fontSize:12,fontWeight:500,color:TOKENS.raise}}>
          {Icon.zap(12)} {xp.toLocaleString('en-IN')} XP
        </div>
        <div style={{display:'flex',alignItems:'center',gap:5,fontFamily:SANS,fontSize:12,color:streak>0?'#c05c1a':TOKENS.ink3}}>
          {Icon.fire(12)} {streak}d
        </div>
      </div>
      <div style={{height:4,background:'rgba(31,93,58,0.15)',borderRadius:2,overflow:'hidden',marginBottom:8}}>
        <div style={{height:'100%',width:`${progress}%`,background:TOKENS.raise,borderRadius:2,transition:'width 400ms ease'}}/>
      </div>
      <div style={{fontFamily:SANS,fontSize:10,color:TOKENS.ink3,marginBottom:earnedBadges.length?8:0}}>
        {nextMilestone-xp} XP to next milestone
      </div>
      {earnedBadges.length>0 && (
        <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
          {earnedBadges.slice(0,5).map(b=>(
            <span key={b.id} title={`${b.label} — ${b.desc}`} style={{fontSize:14,cursor:'default'}}>{b.emoji}</span>
          ))}
          {earnedBadges.length>5 && <span style={{fontFamily:SANS,fontSize:10,color:TOKENS.ink3,alignSelf:'center'}}>+{earnedBadges.length-5}</span>}
        </div>
      )}
    </div>
  );
}

function App() {
  const [route, setRoute]             = React.useState('home');
  const [voted, setVoted]             = usePersisted('bk_voted', {});
  const [shortlisted, setShortlisted] = usePersisted('bk_shortlisted', { glyph:true, noma:true });
  const [commitFor, setCommitFor]     = React.useState(null);
  const [feedLayout, setFeedLayout]   = React.useState('editorial');
  const [globalSector, setGlobalSector] = React.useState('All');
  const [authModal, setAuthModal]     = React.useState(null);
  const [comingSoon, setComingSoon]   = React.useState(null);

  // ── Community / Gamification state ──────────────────────────
  const [userXP,      setUserXP]      = usePersisted('bk_xp', 0);
  const [userStreak,  setUserStreak]  = usePersisted('bk_streak', 1);
  const [userBadges,  setUserBadges]  = usePersisted('bk_badges', ['early_bird']);
  // interests: { [ideaId]: { message, amount, status: 'pending'|'accepted'|'declined' } }
  const [interests,   setInterests]   = usePersisted('bk_interests', {});
  const [interestFor,  setInterestFor]  = React.useState(null);
  const [isPro,        setIsPro]        = usePersisted('bk_pro', false);
  const [upgradeModal, setUpgradeModal] = React.useState(null); // null | feature string
  const [chatFor,     setChatFor]     = React.useState(null);  // { idea, interestData } when ChatModal open

  // Award XP and check badge unlocks
  const awardXP = React.useCallback((action) => {
    const pts = XP_ACTIONS[action] || 0;
    if (!pts) return;
    setUserXP(prev => {
      const next = prev + pts;
      // Check badge unlocks based on new XP total
      setUserBadges(badges => {
        const earned = [...badges];
        if (!earned.includes('first_look') && next >= 25) earned.push('first_look');
        if (!earned.includes('on_fire') && userStreak >= 7) earned.push('on_fire');
        if (!earned.includes('deal_maker') && action==='commit') earned.push('deal_maker');
        if (!earned.includes('founder') && action==='list_startup') earned.push('founder');
        return earned;
      });
      return next;
    });
  }, [userStreak]);

  // Expose globally so deeply-nested components can trigger without prop drilling
  React.useEffect(() => {
    window.__comingSoon = setComingSoon;
    window.__awardXP = awardXP;
    window.__openInterest = setInterestFor;
    window.__openChat = setChatFor;
    return () => {
      window.__comingSoon = null;
      window.__awardXP = null;
      window.__openInterest = null;
      window.__openChat = null;
    };
  }, [awardXP]);

  const isMobile = useMediaQuery('(max-width: 767px)');

  // ── Firebase auth state ──────────────────────────────────────
  // undefined = still loading, null = signed out, object = signed in
  const [fbUser,    setFbUser]    = React.useState(IS_PLACEHOLDER ? null : undefined);
  const [fbProfile, setFbProfile] = React.useState(null);
  const [guestMode, setGuestMode] = React.useState(false);

  // ── Live startup feed (Supabase realtime) ───────────────────
  // When Supabase is configured: fetch + realtime channel.
  // When placeholder (or empty table): falls back to static IDEAS.
  const [startups, setStartups] = React.useState(IDEAS);
  React.useEffect(() => {
    if (!window.sbClient) return; // placeholder — keep static IDEAS
    // Normalize flat Supabase columns → nested raise object (matches static IDEAS shape)
    const normalizeStartup = (d) => ({
      ...d,
      upvotes: d.votes || 0,
      raise: d.raise || {
        target:    d.raise_target    || 500000,
        minTicket: d.raise_min_ticket|| 25000,
        valuation: d.raise_valuation || '₹5Cr cap',
        committed: d.raise_committed || 0,
        raised:    d.raise_committed || 0,
        investors: d.raise_investors || 0,
        daysLeft:  d.raise_days_left || 60,
      },
    });
    const fetchStartups = async () => {
      const { data } = await window.sbClient.from('startups')
        .select('*')
        .in('status', ['published', 'pending_review'])
        .order('created_at', { ascending: false });
      if (data?.length) setStartups(data.map(normalizeStartup));
    };
    fetchStartups();
    const channel = window.sbClient.channel('startups-feed')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'startups' }, fetchStartups)
      .subscribe();
    return () => window.sbClient.removeChannel(channel);
  }, []);

  // ── Supabase auth state listener ────────────────────────────
  React.useEffect(() => {
    if (!window.sbClient) { setFbUser(null); return; }
    // Check existing session first (handles OAuth redirect return)
    window.sbClient.auth.getSession().then(({ data: { session } }) => {
      const u = session?.user || null;
      setFbUser(u);
      if (u) fbFetchProfile(u.id).then(prof => {
        setFbProfile(prof);
        if (prof?.role) {
          const roleHome = { investor:'home', founder:'founder-dashboard', student:'discover' };
          setRoute(roleHome[prof.role] || 'home');
        }
      }).catch(()=>setFbProfile(null));
    });
    // Subscribe to future changes (sign-in / sign-out)
    const { data: { subscription } } = window.sbClient.auth.onAuthStateChange(async (event, session) => {
      const u = session?.user || null;
      setFbUser(u);
      if (u) {
        try {
          const prof = await fbFetchProfile(u.id);
          setFbProfile(prof);
          if (prof?.role) {
            const roleHome = { investor:'home', founder:'founder-dashboard', student:'discover' };
            setRoute(roleHome[prof.role] || 'home');
          }
        } catch(_) { setFbProfile(null); }
      } else {
        setFbProfile(null);
      }
    });
    return () => subscription.unsubscribe();
  }, []);

  // Build the `user` object from Supabase session or keep guest default
  const initials = (name='') => name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase() || '?';
  const sbName = fbUser ? (fbProfile?.display_name || fbUser.user_metadata?.full_name || fbUser.user_metadata?.name || fbUser.email?.split('@')[0] || 'User') : '';
  const user = fbUser
    ? {
        name:     sbName,
        role:     fbProfile?.role ? (fbProfile.role.charAt(0).toUpperCase()+fbProfile.role.slice(1)+' · Verified') : 'Setting up…',
        initials: initials(sbName),
        photoURL: fbUser.user_metadata?.avatar_url || fbUser.user_metadata?.picture || '',
      }
    : { name:'Guest', role:'Browsing as guest', initials:'G', photoURL:'' };

  const go = (r) => { setRoute(r); window.scrollTo(0,0); };
  const toggleVote      = (id) => setVoted(v=>({...v,[id]:!v[id]}));
  const toggleShortlist = (id) => {
    if (!fbUser && !guestMode) { setAuthModal('signup'); return; }
    setShortlisted(s=>({...s,[id]:!s[id]}));
  };

  const unreadCount = NOTIFICATIONS.filter(n=>n.unread).length;

  // Gate actions that require auth
  const requireAuth = (cb) => {
    if (!fbUser && !guestMode) { setAuthModal('signup'); return; }
    cb();
  };

  // Derive current nav item for highlighting
  const navCurrent = React.useMemo(()=>{
    if (route.startsWith('idea/'))    return 'discover';
    if (route.startsWith('founder/')) return 'discover';
    return route;
  }, [route]);

  // Page title / kicker lookup
  const getMeta = () => {
    if (route==='home')             return { title:'Home', kicker:'Welcome back, Avery' };
    if (route==='discover')         return { title:'Discover', kicker:`${startups.filter(i=>i.stage==='Raise').length} open raises · ${startups.filter(i=>i.stage==='Concept').length} concepts`, showSearch:true };
    if (route==='shortlist')        return { title:'Shortlist', kicker:'Ideas you\'re tracking' };
    if (route==='compare')          return { title:'Compare raises', kicker:'Side-by-side · open in any tab' };
    if (route==='portfolio')        return { title:'Portfolio', kicker:'Your investments' };
    if (route==='notifications')    return { title:'Notifications', kicker:unreadCount>0?`${unreadCount} unread`:'All caught up' };
    if (route==='investor-onboard') return { title:'Investor onboarding', kicker:'' };
    if (route==='founder-onboard')  return { title:'List an idea', kicker:'Concept or open raise' };
    if (route==='founder-dashboard')return { title:'Founder dashboard', kicker:'Your active raise' };
    if (route==='profile-settings') return { title:'Profile & settings', kicker:user.name };
    if (route==='admin')            return { title:'Moderation', kicker:'Admin only' };
    if (route==='strategy')         return { title:'Strategy memo', kicker:'Concept · GTM · monetization · legal' };
    if (route==='india-guide')      return { title:'India Registration Guide', kicker:'Pvt Ltd · DPIIT · SEBI · 10–14 days' };
    if (route==='leaderboard')      return { title:'Leaderboard', kicker:`⚡ Your XP: ${userXP.toLocaleString('en-IN')} · 🔥 ${userStreak}d streak` };
    if (route==='ai-studio')        return { title:'AI Studio', kicker: isPro ? '✨ Pro Active — Unlimited AI tools' : '6 AI tools · 2 free · 4 Pro' };
    if (route==='seo-tools')        return { title:'SEO & Marketing', kicker: isPro ? '✨ Pro Active — All tools unlocked' : 'LinkedIn · Twitter · Keywords · Press Release' };
    if (route==='pricing')          return { title:'Pro Plans', kicker:'7-day free trial · Cancel anytime' };
    if (route.startsWith('idea/')) {
      const id = route.split('/')[1];
      const idea = startups.find(i=>i.id===id);
      return { title:idea?.name||'Idea', kicker:idea?.tagline||'' };
    }
    if (route.startsWith('founder/')) return { title:'Founder profile', kicker:'' };
    return { title:'Backable', kicker:'' };
  };

  const meta = getMeta();
  const [search, setSearch] = React.useState('');

  const renderContent = () => {
    if (route==='home')              return <Homepage go={go} onSectorNav={setGlobalSector}/>;
    if (route==='discover')          return <Discover go={go} layout={feedLayout} voted={voted} toggleVote={(id)=>{ toggleVote(id); awardXP('vote'); }} shortlisted={shortlisted} toggleShortlist={toggleShortlist} initialSector={globalSector} onSectorChange={setGlobalSector}/>;
    if (route==='shortlist')         return <Shortlist go={go} shortlisted={shortlisted} toggleShortlist={toggleShortlist}/>;
    if (route==='compare')           return <Compare go={go}/>;
    if (route==='portfolio')         return <InvestorDashboard go={go}/>;
    if (route==='notifications')     return <Notifications go={go}/>;
    // ── Auth-gated routes: require a real signed-in user (not just guest mode) ──
    const authGate = (component, action) => {
      if (!fbUser) return <GuestGate action={action} onAuth={(m)=>{ setAuthModal(m); }} onBack={()=>go('home')}/>;
      return component;
    };
    if (route==='investor-onboard')  return authGate(<InvestorOnboard go={go}/>, 'onboard as an investor');
    if (route==='founder-onboard')   return authGate(<FounderOnboard go={go}/>, 'list a startup');
    if (route==='founder-dashboard') return authGate(<FounderDashboard go={go}/>, 'view your founder dashboard');
    if (route==='profile-settings')  return authGate(<ProfileSettings user={user}/>, 'edit your profile');
    if (route==='admin')             return <AdminModeration go={go}/>;
    if (route==='strategy')          return <Strategy/>;
    if (route==='india-guide')       return <IndiaGuide go={go}/>;
    if (route==='leaderboard')       return <Leaderboard go={go}/>;
    if (route==='ai-studio')         return <AIStudio isPro={isPro} onUpgrade={(f)=>setUpgradeModal(f)}/>;
    if (route==='seo-tools')         return <SEOTools isPro={isPro} onUpgrade={(f)=>setUpgradeModal(f)}/>;
    if (route==='pricing')           return <div style={{maxWidth:700,margin:'0 auto'}}><div style={{fontFamily:SERIF,fontSize:26,fontWeight:500,marginBottom:24}}>Choose your plan</div>{PRO_PLANS.map(p=><Card key={p.id} style={{padding:24,marginBottom:12}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><div><div style={{fontFamily:SANS,fontSize:16,fontWeight:600}}>{p.label}</div><div style={{fontFamily:SANS,fontSize:13,color:TOKENS.ink3}}>{p.desc}</div></div><div style={{textAlign:'right'}}><div style={{fontFamily:SERIF,fontSize:22,fontWeight:500,color:p.color}}>{p.price}<span style={{fontFamily:SANS,fontSize:12,color:TOKENS.ink3}}>/mo</span></div><Btn variant="raise" size="sm" style={{marginTop:8}} onClick={()=>setUpgradeModal(p.label)}>Choose {p.label}</Btn></div></div></Card>)}</div>;
    if (route.startsWith('idea/')) {
      const id = route.split('/')[1];
      const onInterest = (idea) => {
        setInterestFor(idea);
        awardXP('view_startup');
      };
      return <IdeaDetail ideaId={id} go={go} layout="split" voted={voted} toggleVote={(iid)=>{ toggleVote(iid); awardXP('vote'); }} shortlisted={shortlisted} toggleShortlist={toggleShortlist}
        onCommit={(amt)=>setCommitFor({...startups.find(i=>i.id===id), _commitAmount: amt})}
        onInterest={()=>onInterest(startups.find(i=>i.id===id))}/>;
    }
    if (route.startsWith('founder/')) {
      const id = route.split('/')[1];
      return <FounderProfile founderId={id} go={go}/>;
    }
    return <EmptyState icon={Icon.search(22)} title="Page not found" body="This route doesn't exist." cta="Go home" onCta={()=>go('home')}/>;
  };

  // ── Auth loading splash ──────────────────────────────────────
  if (fbUser === undefined) {
    return (
      <StartupsCtx.Provider value={startups}>
      <div style={{minHeight:'100vh',background:TOKENS.bg,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}>
        <Logo size={22}/>
        <Spinner size={20} color={TOKENS.ink3}/>
      </div>
      </StartupsCtx.Provider>
    );
  }

  // ── Role selection (first sign-in) ───────────────────────────
  if (fbUser && (!fbProfile || !fbProfile.role)) {
    return (
      <StartupsCtx.Provider value={startups}>
      <ToastProvider>
        <RoleSelectScreen
          user={fbUser}
          onSelect={(role) => {
            setFbProfile(p=>({...p, role}));
            const roleHome = { investor:'home', founder:'founder-dashboard', student:'discover' };
            setRoute(roleHome[role] || 'home');
          }}
        />
      </ToastProvider>
      </StartupsCtx.Provider>
    );
  }

  // ── Unauthenticated gate (not guest) ─────────────────────────
  if (!fbUser && !guestMode) {
    return (
      <StartupsCtx.Provider value={startups}>
      <ToastProvider>
        <AuthGate
          onGuest={()=>setGuestMode(true)}
          onSignIn={()=>setAuthModal('signin')}
          onSignUp={()=>setAuthModal('signup')}
        />
        {authModal && <AuthModal defaultTab={authModal} onClose={()=>setAuthModal(null)}
          onDemoSignIn={(mockUser)=>{ setFbUser(mockUser); setGuestMode(false); setAuthModal(null); }}/>}
      </ToastProvider>
      </StartupsCtx.Provider>
    );
  }

  return (
    <StartupsCtx.Provider value={startups}>
    <ToastProvider>
    <div style={{display:'flex',minHeight:'100vh',background:TOKENS.bg}}>
      <Nav current={navCurrent} go={go} user={user} onSignIn={()=>setAuthModal('signin')} onSignUp={()=>setAuthModal('signup')} onComingSoon={setComingSoon}
           userXP={userXP} userStreak={userStreak} userBadges={userBadges}
           onSignOut={fbUser ? async()=>{ try{ await fbSignOut(); }catch(_){} setFbUser(null); setFbProfile(null); setGuestMode(false); } : null}/>

      <main style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',paddingBottom:isMobile?72:0}}>
        <TopBar
          title={meta.title}
          kicker={meta.kicker}
          onSearch={meta.showSearch?(v)=>setSearch(v):undefined}
          search={search}
          go={go}
          right={!isMobile && (
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              {/* Layout switcher on discover */}
              {route==='discover' && (
                <div style={{display:'inline-flex',padding:2,background:'#efece4',borderRadius:7,border:`0.5px solid ${TOKENS.hair}`}}>
                  {['editorial','grid','feed'].map(l=>(
                    <button key={l} onClick={()=>setFeedLayout(l)} style={{
                      padding:'4px 10px',borderRadius:5,border:0,cursor:'pointer',
                      background:feedLayout===l?TOKENS.card:'transparent',
                      fontFamily:SANS,fontSize:11,fontWeight:500,
                      color:feedLayout===l?TOKENS.ink:TOKENS.ink3,
                      boxShadow:feedLayout===l?'0 1px 2px rgba(20,18,12,0.06)':'none',
                      textTransform:'capitalize',transition:'all 120ms',
                    }}>{l}</button>
                  ))}
                </div>
              )}
              {/* Notification bell */}
              <button onClick={()=>go('notifications')} style={{
                position:'relative',width:36,height:36,borderRadius:8,
                border:`0.5px solid ${TOKENS.hair}`,background:TOKENS.surface,
                display:'flex',alignItems:'center',justifyContent:'center',
                color:TOKENS.ink2,cursor:'pointer',
              }}>
                {Icon.bell(16)}
                {unreadCount>0 && (
                  <span style={{position:'absolute',top:6,right:6,width:8,height:8,borderRadius:999,background:TOKENS.raise,border:'1.5px solid #fbfaf6'}}/>
                )}
              </button>
              {route!=='founder-onboard'   && <Btn variant="ghost"   size="sm" onClick={()=>go('founder-onboard')} icon={Icon.plus(12)}>List an idea</Btn>}
              {route!=='investor-onboard'  && <Btn variant="primary" size="sm" onClick={()=>setAuthModal('signup')}>Become an investor</Btn>}
            </div>
          )}
        />

        <div style={{flex:1,padding:isMobile?'20px 16px 24px':'36px 36px 80px',maxWidth:1280,width:'100%',alignSelf:'center'}}>
          {renderContent()}
        </div>
      </main>

      {commitFor   && <CommitModal idea={commitFor} amount={commitFor._commitAmount} onClose={()=>setCommitFor(null)}/>}
      {interestFor && (
        <InterestModal
          idea={interestFor}
          onClose={()=>setInterestFor(null)}
          onSubmit={(data)=>{
            setInterests(prev=>({...prev, [interestFor.id]:{ ...data, status:'pending', sentAt:new Date().toISOString() }}));
            awardXP('express_interest');
            // badge: connector (3 interests)
            setUserBadges(b=>{ const next=[...b]; const count=Object.keys(interests).length+1; if(count>=3&&!next.includes('connector')) next.push('connector'); return next; });
          }}
        />
      )}
      {chatFor && (
        <ChatModal
          idea={chatFor.idea}
          interestData={chatFor.interestData}
          onClose={()=>setChatFor(null)}
        />
      )}
      {authModal    && <AuthModal defaultTab={authModal} onClose={()=>setAuthModal(null)}
          onDemoSignIn={(mockUser)=>{ setFbUser(mockUser); setGuestMode(false); setAuthModal(null); }}/>}
      {upgradeModal && <UpgradeModal feature={upgradeModal} onClose={()=>setUpgradeModal(null)}/>}
      {comingSoon   && <ComingSoonModal feature={comingSoon} onClose={()=>setComingSoon(null)}/>}
      <BackableAssistant/>
    </div>
    </ToastProvider>
    </StartupsCtx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

</script>
</body>
</html>
