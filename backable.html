<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Backable — Investment Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f6f4ef; color: #15140f; font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }
  ::selection { background: #1f5d3a; color: #fbfaf6; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(20,18,12,0.15); border-radius: 3px; }
  @media (max-width: 767px) {
    .desktop-only { display: none !important; }
  }
  @media (min-width: 768px) {
    .mobile-only { display: none !important; }
  }
  /* ── Animations ─────────────────────────────── */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }
  .card-enter { animation: fadeInUp 260ms cubic-bezier(.22,.68,0,1.2) both; }
  /* ── Toast ───────────────────────────────────── */
  .toast-container {
    position: fixed; top: 20px; right: 20px; z-index: 9000;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .toast {
    animation: slideDown 220ms ease both;
    pointer-events: all;
    max-width: 340px;
  }
  /* ── Modal backdrop ──────────────────────────── */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 800;
    background: rgba(20,18,12,0.45);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
</style>
<!-- Firebase v9 compat (global `firebase` object — no ES modules needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// FIREBASE CONFIG — replace with your own from Firebase Console
// Project Settings → Web App → firebaseConfig
// ═══════════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_PROJECT.firebaseapp.com",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId:             "YOUR_APP_ID"
};
const IS_PLACEHOLDER = firebaseConfig.apiKey === "YOUR_API_KEY";
if (!IS_PLACEHOLDER) {
  firebase.initializeApp(firebaseConfig);
  window.fbAuth = firebase.auth();
  window.fbDb   = firebase.firestore();
} else {
  window.fbAuth = null;
  window.fbDb   = null;
}
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ═══════════════════════════════════════════════
// 1. DESIGN SYSTEM
// ═══════════════════════════════════════════════

const TOKENS = {
  bg:       '#f6f4ef',
  surface:  '#fbfaf6',
  card:     '#ffffff',
  ink:      '#15140f',
  ink2:     '#3a3830',
  ink3:     '#6e6b60',
  ink4:     '#a09c90',
  hair:     'rgba(20,18,12,0.10)',
  hair2:    'rgba(20,18,12,0.06)',
  raise:    '#1f5d3a',
  raiseBg:  '#e6efe7',
  warn:     '#8a4a1c',
  warnBg:   '#f3e6d8',
  closing:  '#7a1f1f',
  closingBg:'#f0e0de',
  blue:     '#1a3a5c',
  blueBg:   '#e0e8f0',
};

const SERIF = `"Source Serif 4","Source Serif Pro","Noto Serif",Georgia,serif`;
const SANS  = `"Inter Tight",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif`;
const MONO  = `"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace`;

// ── Startups context ─────────────────────────────────────────
// Populated from Firestore when live; falls back to static IDEAS in placeholder/offline mode.
const StartupsCtx = React.createContext([]);
const useStartups = () => React.useContext(StartupsCtx);

function useMediaQuery(q) {
  const [m, setM] = React.useState(() => window.matchMedia(q).matches);
  React.useEffect(() => {
    const mq = window.matchMedia(q);
    const h = (e) => setM(e.matches);
    mq.addEventListener('change', h);
    return () => mq.removeEventListener('change', h);
  }, [q]);
  return m;
}

// ═══════════════════════════════════════════════
// 2. ICONS
// ═══════════════════════════════════════════════

const Icon = {
  search:   (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" strokeWidth="1.2"/><path d="M10.5 10.5l3 3" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>,
  up:       (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M8 3l5 6H3l5-6z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg>,
  upFilled: (s=14) => <svg width={s} height={s} viewBox="0 0 16 16"><path d="M8 3l5 6H3l5-6z" fill="currentColor"/></svg>,
  comment:  (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M3 4.5A1.5 1.5 0 0 1 4.5 3h7A1.5 1.5 0 0 1 13 4.5v5A1.5 1.5 0 0 1 11.5 11H6.5l-3 2.5V4.5z" stroke="currentColor" strokeWidth="1.2"/></svg>,
  bookmark: (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M4 2.5h8v11l-4-2.5L4 13.5v-11z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg>,
  bookmarkFilled:(s=14) => <svg width={s} height={s} viewBox="0 0 16 16"><path d="M4 2.5h8v11l-4-2.5L4 13.5v-11z" fill="currentColor"/></svg>,
  check:    (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  arrow:    (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  chevron:  (s=14, dir='down') => { const r={down:0,up:180,left:90,right:-90}[dir]; return <svg width={s} height={s} viewBox="0 0 16 16" fill="none" style={{transform:`rotate(${r}deg)`}}><path d="M4 6l4 4 4-4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>; },
  globe:    (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" strokeWidth="1.2"/><path d="M2.5 8h11M8 2.5c2 2 2 9 0 11M8 2.5c-2 2-2 9 0 11" stroke="currentColor" strokeWidth="1.2"/></svg>,
  shield:   (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M8 2l5 2v4c0 3-2.5 5-5 6-2.5-1-5-3-5-6V4l5-2z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg>,
  play:     (s=14) => <svg width={s} height={s} viewBox="0 0 16 16"><path d="M5 3l8 5-8 5V3z" fill="currentColor"/></svg>,
  doc:      (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M4 2h6l3 3v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" stroke="currentColor" strokeWidth="1.2"/><path d="M10 2v3h3" stroke="currentColor" strokeWidth="1.2"/></svg>,
  plus:     (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
  spark:    (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M8 2v4M8 10v4M2 8h4M10 8h4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
  filter:   (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M2 4h12M4 8h8M6 12h4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
  user:     (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><circle cx="8" cy="6" r="2.5" stroke="currentColor" strokeWidth="1.2"/><path d="M3 13c.5-2.5 2.5-4 5-4s4.5 1.5 5 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>,
  external: (s=12) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M6 4h6v6M12 4l-7 7" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  bell:     (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M8 2a4 4 0 0 1 4 4v3l1 2H3l1-2V6a4 4 0 0 1 4-4z" stroke="currentColor" strokeWidth="1.2"/><path d="M6.5 13a1.5 1.5 0 0 0 3 0" stroke="currentColor" strokeWidth="1.2"/></svg>,
  home:     (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M2 8l6-5 6 5v6H10v-3H6v3H2V8z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg>,
  settings: (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2" stroke="currentColor" strokeWidth="1.2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M3.1 12.9l1.4-1.4M11.5 4.5l1.4-1.4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>,
  flag:     (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M3 2v12M3 2h9l-2 4 2 4H3" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg>,
  chart:    (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M2 12l4-4 3 2 5-6" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  clock:    (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" strokeWidth="1.2"/><path d="M8 5v3.5l2 1.5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>,
  menu:     (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
  close:    (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
  star:     (s=14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M8 2l1.8 3.6L14 6.3l-3 2.9.7 4.1L8 11.3l-3.7 1.9.7-4.1-3-2.9 4.2-.7L8 2z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg>,
  starFilled:(s=14) => <svg width={s} height={s} viewBox="0 0 16 16"><path d="M8 2l1.8 3.6L14 6.3l-3 2.9.7 4.1L8 11.3l-3.7 1.9.7-4.1-3-2.9 4.2-.7L8 2z" fill="currentColor"/></svg>,
};

// ═══════════════════════════════════════════════
// 3. ATOMS
// ═══════════════════════════════════════════════

function Logo({ size=18, color }) {
  const c = color || TOKENS.ink;
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:8,color:c}}>
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
        <rect x="2.5" y="2.5" width="19" height="19" rx="4" stroke={c} strokeWidth="1.4"/>
        <path d="M8 8h5a3.5 3.5 0 0 1 0 7H8V8z" stroke={c} strokeWidth="1.4" fill="none"/>
        <path d="M8 12h5a3.5 3.5 0 0 1 0 7H8v-7z" stroke={c} strokeWidth="1.4" fill="none"/>
      </svg>
      <span style={{fontFamily:SERIF,fontWeight:600,fontSize:size*0.95,letterSpacing:'-0.01em'}}>Backable</span>
    </span>
  );
}

function Pill({ tone='neutral', children, dot=false, style={} }) {
  const tones = {
    neutral: { bg:'#efece4', fg:TOKENS.ink2 },
    raise:   { bg:TOKENS.raiseBg, fg:TOKENS.raise },
    concept: { bg:'#ece8de', fg:TOKENS.ink2 },
    warn:    { bg:TOKENS.warnBg, fg:TOKENS.warn },
    closing: { bg:TOKENS.closingBg, fg:TOKENS.closing },
    outline: { bg:'transparent', fg:TOKENS.ink2, border:TOKENS.hair },
    blue:    { bg:TOKENS.blueBg, fg:TOKENS.blue },
  };
  const t = tones[tone] || tones.neutral;
  return (
    <span style={{
      display:'inline-flex',alignItems:'center',gap:6,
      fontFamily:SANS,fontSize:11,fontWeight:500,letterSpacing:'0.01em',
      padding:'3px 8px',borderRadius:999,
      background:t.bg,color:t.fg,
      border:`0.5px solid ${t.border||'transparent'}`,
      whiteSpace:'nowrap',...style,
    }}>
      {dot && <span style={{width:6,height:6,borderRadius:999,background:t.fg}}/>}
      {children}
    </span>
  );
}

function Btn({ variant='primary', size='md', children, onClick, style={}, icon, full, disabled, loading }) {
  const variants = {
    primary: { bg:TOKENS.ink,    fg:'#fbfaf6', border:TOKENS.ink },
    raise:   { bg:TOKENS.raise,  fg:'#fbfaf6', border:TOKENS.raise },
    ghost:   { bg:'transparent', fg:TOKENS.ink, border:TOKENS.hair },
    quiet:   { bg:'#efece4',     fg:TOKENS.ink, border:'transparent' },
    danger:  { bg:'transparent', fg:TOKENS.closing, border:TOKENS.hair },
  };
  const sizes = {
    sm: { pad:'6px 12px',  fs:12, h:28 },
    md: { pad:'9px 16px',  fs:13, h:36 },
    lg: { pad:'12px 22px', fs:14, h:44 },
  };
  const v = variants[variant], s = sizes[size];
  return (
    <button onClick={onClick} disabled={disabled} style={{
      display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8,
      fontFamily:SANS,fontWeight:500,fontSize:s.fs,letterSpacing:'-0.005em',
      padding:s.pad,height:s.h,width:full?'100%':'auto',
      background:v.bg,color:v.fg,border:`0.5px solid ${v.border}`,
      borderRadius:8,cursor:disabled?'not-allowed':'pointer',
      transition:'all 120ms',opacity:disabled?0.5:1,
      whiteSpace:'nowrap',...style,
    }}
      onMouseEnter={(e)=>{ if(!disabled) e.currentTarget.style.opacity='0.82'; }}
      onMouseLeave={(e)=>{ if(!disabled) e.currentTarget.style.opacity='1'; }}
    >{loading ? <Spinner size={size==='sm'?12:14} color={variant==='ghost'||variant==='quiet'?TOKENS.ink:'rgba(255,255,255,0.8)'}/> : icon}{children}</button>
  );
}

function Input({ value, onChange, placeholder, type='text', icon, style={}, full }) {
  return (
    <div style={{
      display:'flex',alignItems:'center',gap:8,
      padding:'0 12px',height:38,
      background:TOKENS.surface,border:`0.5px solid ${TOKENS.hair}`,
      borderRadius:8,width:full?'100%':'auto',...style,
    }}>
      {icon && <span style={{color:TOKENS.ink3,display:'inline-flex'}}>{icon}</span>}
      <input type={type} value={value||''} onChange={(e)=>onChange?.(e.target.value)}
        placeholder={placeholder}
        style={{flex:1,border:0,outline:0,background:'transparent',
          fontFamily:SANS,fontSize:13,color:TOKENS.ink,minWidth:0}}/>
    </div>
  );
}

function Card({ children, style={}, onClick, hoverable }) {
  const [h,setH] = React.useState(false);
  return (
    <div onClick={onClick}
      onMouseEnter={()=>hoverable&&setH(true)}
      onMouseLeave={()=>hoverable&&setH(false)}
      style={{
        background:TOKENS.card,
        border:`0.5px solid ${h?TOKENS.ink4:TOKENS.hair}`,
        borderRadius:14,cursor:onClick?'pointer':'default',
        transition:'all 160ms',
        boxShadow:h?'0 4px 16px rgba(20,18,12,0.08)':'0 1px 0 rgba(20,18,12,0.02)',
        ...style,
      }}
    >{children}</div>
  );
}

function CoverArt({ tone='#c0bfb5', label, height=180, style={} }) {
  return (
    <div style={{
      position:'relative',width:'100%',height,background:tone,
      backgroundImage:`repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,0.08) 14px 15px)`,
      borderRadius:10,overflow:'hidden',...style,
    }}>
      {label && <div style={{position:'absolute',left:12,bottom:10,fontFamily:MONO,fontSize:10,color:'rgba(255,255,255,0.7)',textTransform:'uppercase',letterSpacing:'0.08em'}}>{label}</div>}
    </div>
  );
}

function Avatar({ name, initials, tone, size=36 }) {
  return (
    <div title={name} style={{
      width:size,height:size,borderRadius:999,
      background:tone||'#3a3830',color:'#fbfaf6',
      fontFamily:SANS,fontWeight:500,fontSize:size*0.36,
      display:'inline-flex',alignItems:'center',justifyContent:'center',
      letterSpacing:'0.02em',flexShrink:0,
    }}>{initials||(name||'').slice(0,2)}</div>
  );
}

function Progress({ pct, height=4, tone }) {
  return (
    <div style={{width:'100%',height,borderRadius:999,background:TOKENS.hair2,overflow:'hidden'}}>
      <div style={{width:`${Math.min(100,Math.max(0,pct))}%`,height:'100%',background:tone||TOKENS.raise,borderRadius:999}}/>
    </div>
  );
}

function Stat({ k, v, sub, accent }) {
  return (
    <div>
      <div style={{fontFamily:MONO,fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:TOKENS.ink3,marginBottom:6}}>{k}</div>
      <div style={{fontFamily:SERIF,fontSize:26,fontWeight:500,color:accent||TOKENS.ink,lineHeight:1,letterSpacing:'-0.01em'}}>{v}</div>
      {sub && <div style={{fontFamily:SANS,fontSize:11,color:TOKENS.ink3,marginTop:4}}>{sub}</div>}
    </div>
  );
}

function Divider({ style={} }) {
  return <div style={{height:1,background:TOKENS.hair,width:'100%',...style}}/>;
}

function Section({ title, kicker, action, children, style={} }) {
  return (
    <section style={{...style}}>
      {(title||kicker||action) && (
        <header style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:16}}>
          <div>
            {kicker && <div style={{fontFamily:MONO,fontSize:10,letterSpacing:'0.12em',textTransform:'uppercase',color:TOKENS.ink3,marginBottom:4}}>{kicker}</div>}
            {title && <h2 style={{fontFamily:SERIF,fontSize:24,fontWeight:500,color:TOKENS.ink,margin:0,letterSpacing:'-0.01em'}}>{title}</h2>}
          </div>
          {action}
        </header>
      )}
      {children}
    </section>
  );
}

function Field({ label, hint, children, required }) {
  return (
    <div style={{display:'flex',flexDirection:'column',gap:6}}>
      <label style={{fontFamily:SANS,fontSize:12,fontWeight:500,color:TOKENS.ink2}}>
        {label} {required && <span style={{color:TOKENS.warn}}>*</span>}
      </label>
      {children}
      {hint && <div style={{fontFamily:SANS,fontSize:11,color:TOKENS.ink3,lineHeight:1.4}}>{hint}</div>}
    </div>
  );
}

function TextArea({ value, onChange, placeholder, rows=4 }) {
  return (
    <textarea value={value||''} onChange={(e)=>onChange?.(e.target.value)} placeholder={placeholder} rows={rows} style={{
      padding:12,borderRadius:8,border:`0.5px solid ${TOKENS.hair}`,background:TOKENS.surface,
      fontFamily:SERIF,fontSize:14,color:TOKENS.ink,resize:'vertical',outline:0,lineHeight:1.5,
    }}/>
  );
}

function UploadTile({ title, sub, optional, accent }) {
  const [h,setH] = React.useState(false);
  return (
    <button style={{
      display:'flex',flexDirection:'column',alignItems:'flex-start',gap:4,
      padding:18,borderRadius:10,width:'100%',textAlign:'left',
      border:`0.5px dashed ${h?TOKENS.ink2:TOKENS.ink4}`,background:TOKENS.surface,
      cursor:'pointer',transition:'all 120ms',
    }} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}>
      <div style={{display:'flex',alignItems:'center',gap:8,width:'100%'}}>
        <div style={{width:28,height:28,borderRadius:6,background:accent||'#efece4',display:'flex',alignItems:'center',justifyContent:'center',color:TOKENS.ink2}}>{Icon.plus()}</div>
        <span style={{fontFamily:SANS,fontSize:13,fontWeight:500,color:TOKENS.ink}}>{title}</span>
        {optional && <Pill tone="outline">Optional</Pill>}
      </div>
      <span style={{fontFamily:SANS,fontSize:11,color:TOKENS.ink3,lineHeight:1.4}}>{sub}</span>
    </button>
  );
}

function StepIndicator({ steps, current }) {

    <div style={{display:'flex',alignItems:'center',gap:0,marginBottom:32,flexWrap:'wrap',gap:8}}>

        const done=i<current, active=i===current;
        return (
          <React.Fragment key={i}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{width:24,height:24,borderRadius:999,
                background:done?TOKENS.ink:(active?TOKENS.ink:TOKENS.surface),
                border:`0.5px solid ${active||done?TOKENS.ink:TOKENS.hair}`,
                color:done||active?TOKENS.surface:TOKENS.ink3,
                fontFamily:SANS,fontSize:11,fontWeight:500,
                display:'flex',alignItems:'center',justifyContent:'center',
              }}>{done?Icon.check(12):i+1}</div>
              <div style={{fontFamily:SANS,fontSize:12,fontWeight:active?500:400,color:active?TOKENS.ink:(done?TOKENS.ink2:TOKENS.ink3)}}>{s}</div>
            </div>
            {i<steps.length-1 && <div style={{flex:1,minWidth:16,height:1,background:TOKENS.hair}}/>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function fmtMoney(n, currency='$') {
  if (n>=1000000) return `${currency}${(n/1000000).toFixed(n%1000000===0?0:1)}M`;
  if (n>=1000)    return `${currency}${(n/1000).toFixed(0)}k`;
  return `${currency}${n}`;
}

async function fbSaveProfile(uid, data) {
  if (!window.fbDb) return;
  await window.fbDb.collection('users').doc(uid).set(data, { merge: true });
}
async function fbFetchProfile(uid) {
  if (!window.fbDb) return null;
  const snap = await window.fbDb.collection('users').doc(uid).get();
  return snap.exists ? snap.data() : null;
}
async function fbSignInGoogle() {
  if (!window.fbAuth) return null;
  const provider = new firebase.auth.GoogleAuthProvider();
  const result = await window.fbAuth.signInWithPopup(provider);
  return result.user;
}
async function fbSignInGitHub() {
  if (!window.fbAuth) return null;
  const provider = new firebase.auth.GithubAuthProvider();
  const result = await window.fbAuth.signInWithPopup(provider);
  return result.user;
}
async function fbSignOut() {
  if (!window.fbAuth) return;
  await window.fbAuth.signOut();
}

// ─── Toast system ─────────────────────────────────────────────────────────────
const ToastContext = React.createContext(null);

function ToastProvider({ children }) {
  const [toasts, setToasts] = React.useState([]);
  const add = React.useCallback((msg, tone='success', duration=3500) => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, tone }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), duration);
  }, []);
  const toneStyle = (tone) => ({
    success: { bg:TOKENS.raiseBg, border:`0.5px solid rgba(31,93,58,0.25)`, color:TOKENS.raise },
    error:   { bg:TOKENS.closingBg, border:`0.5px solid rgba(122,31,31,0.25)`, color:TOKENS.closing },
    info:    { bg:TOKENS.blueBg, border:`0.5px solid rgba(26,58,92,0.2)`, color:TOKENS.blue },
    warn:    { bg:TOKENS.warnBg, border:`0.5px solid rgba(138,74,28,0.25)`, color:TOKENS.warn },
  }[tone] || {});
  return (
    <ToastContext.Provider value={add}>
      {children}
      <div className="toast-container">
        {toasts.map(t => {
          const s = toneStyle(t.tone);
          return (
            <div key={t.id} className="toast" style={{
              background:s.bg, border:s.border, color:s.color,
              borderRadius:10, padding:'12px 16px',
              fontFamily:SANS, fontSize:13, fontWeight:500,
              boxShadow:'0 4px 16px rgba(20,18,12,0.12)',
              display:'flex', alignItems:'center', gap:10,
            }}>
              {t.tone==='success' && Icon.check(14)}
              {t.tone==='error'   && Icon.close(14)}
              {t.tone==='info'    && Icon.bell(14)}
              {t.msg}
            </div>
          );
        })}
      </div>
    </ToastContext.Provider>
  );
}

function useToast() {
  const ctx = React.useContext(ToastContext);
  if (!ctx) return () => {};
  return ctx;
}

// ─── Trust Badge Panel ───
// `verified` prop gates the 'KYC verified' badge so unverified ideas never show it (P02)
function TrustBadgeRow({ badges, verified }) {
  if (!badges || !badges.length) return null;
  // Remove 'KYC verified' badge if the idea is not verified
  const filteredBadges = badges.filter(b => {
    if (b.toLowerCase().includes('kyc') || b.toLowerCase().includes('verified')) {
      return verified === true;
    }
    return true;
  });
  if (!filteredBadges.length) return null;
  const iconForBadge = (b) => {
    if (b.includes('KYC') || b.includes('verified')) return Icon.shield(12);
    if (b.includes('revenue') || b.includes('Revenue')) return Icon.chart(12);
    if (b.includes('Demo') || b.includes('demo')) return Icon.play(12);
    if (b.includes('Closing')) return Icon.clock(12);
    if (b.includes('Live')) return Icon.globe(12);
    return Icon.check(12);
  };
  return (
    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
      {filteredBadges.map(b => (
        <span key={b} style={{
          display:'inline-flex',alignItems:'center',gap:5,
          padding:'4px 10px',borderRadius:999,
          background:TOKENS.raiseBg,color:TOKENS.raise,
          fontFamily:SANS,fontSize:11,fontWeight:500,
          border:`0.5px solid rgba(31,93,58,0.2)`,
        }}>
          <span style={{display:'inline-flex'}}>{iconForBadge(b)}</span>{b}
        </span>
      ))}
    </div>
  );
}

                display:'flex',alignItems:'center',justifyContent:'center',
                background:m.done?TOKENS.raise:(m.current?TOKENS.ink:TOKENS.surface),
                border:`0.5px solid ${m.done||m.current?TOKENS.ink:TOKENS.hair}`,
                color:m.done||m.current?'#fbfaf6':TOKENS.ink4,
              }}>{m.done?Icon.check(11):<span style={{fontFamily:MONO,fontSize:9}}>{i+1}</span>}</div>
              {i<milestones.length-1 && <div style={{width:1,flex:1,minHeight:12,background:m.done?TOKENS.raise:TOKENS.hair,marginTop:3}}/>}
            </div>
            <div style={{paddingTop:2,paddingBottom:4}}>
              <div style={{fontFamily:SANS,fontSize:13,fontWeight:500,color:m.current?TOKENS.ink:(m.done?TOKENS.ink2:TOKENS.ink3)}}>{m.label}</div>
              {m.date && <div style={{fontFamily:MONO,fontSize:10,color:TOKENS.ink4,marginTop:2}}>{m.date}</div>}
              {m.note && <div style={{fontFamily:SANS,fontSize:12,color:TOKENS.ink3,marginTop:3,lineHeight:1.4}}>{m.note}</div>}
            </div>
          </div>
        ))}
      </div>
    );
  }
  return (
    <div style={{position:'relative',display:'flex',gap:0}}>
      <div style={{position:'absolute',top:11,left:14,right:14,height:1,background:TOKENS.hair}}/>
      {milestones.map((m,i) => (
        <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:8,position:'relative'}}>
          <div style={{
            width:22,height:22,borderRadius:999,zIndex:1,
            display:'flex',alignItems:'center',justifyContent:'center',
            background:m.done?TOKENS.raise:(m.current?TOKENS.ink:TOKENS.surface),
            border:`0.5px solid ${m.done||m.current?TOKENS.ink:TOKENS.hair}`,
            color:m.done||m.current?'#fbfaf6':TOKENS.ink4,
          }}>{m.done?Icon.check(11):<span style={{fontFamily:MONO,fontSize:9}}>{i+1}</span>}</div>
          <div style={{fontFamily:SANS,fontSize:11,color:m.current?TOKENS.ink:(m.done?TOKENS.ink2:TOKENS.ink3),textAlign:'center',lineHeight:1.3}}>{m.label}</div>
          {m.date && <div style={{fontFamily:MONO,fontSize:9,color:TOKENS.ink4}}>{m.date}</div>}
        </div>
      ))}
    </div>
  );
}

function StageBadge({ idea }) {
  if (idea.stage==='Concept') return <Pill tone="concept" dot>Concept</Pill>;
  if (idea.raise?.daysLeft<=5) return <Pill tone="closing" dot>Closing in {idea.raise.daysLeft}d</Pill>;
  return <Pill tone="raise" dot>Open raise</Pill>;
}

function RaiseProgress({ idea, compact }) {
  if (idea.stage!=='Raise') return null;
  const pct=(idea.raise.raised/idea.raise.target)*100;
  const cur=idea.geo.includes('DE')?'€':'$';
  return (
    <div style={{display:'flex',flexDirection:'column',gap:compact?4:6}}>
      <div style={{display:'flex',justifyContent:'space-between',fontFamily:SANS,fontSize:11,color:TOKENS.ink3}}>

function Discover({ go, layout, voted, toggleVote, shortlisted, toggleShortlist }) {
  const IDEAS = useStartups();
  const [filter, setFilter] = React.useState('all');
  const [sort, setSort] = React.useState('trending');
  const [search, setSearch] = React.useState('');
  const [sectorFilter, setSectorFilter] = React.useState('All');
  const isMobile = useMediaQuery('(max-width: 767px)');
  const effectiveLayout = isMobile ? 'feed' : layout;

  const ideas = React.useMemo(() => {
    let list = IDEAS;
    if (filter!=='all') list=list.filter(i=>i.stage===filter);
    if (sectorFilter!=='All') list=list.filter(i=>i.sector===sectorFilter);
    if (search) {
      const q=search.toLowerCase();
      list=list.filter(i=>i.name.toLowerCase().includes(q)||i.tagline.toLowerCase().includes(q)||i.sector.toLowerCase().includes(q));
    }
    list=[...list];
    if (sort==='trending') list.sort((a,b)=>b.upvotes-a.upvotes);
    if (sort==='new') list.reverse();
    if (sort==='closing') list.sort((a,b)=>(a.raise?.daysLeft??999)-(b.raise?.daysLeft??999));
    if (sort==='raised') list.sort((a,b)=>(b.raise?.raised??0)-(a.raise?.raised??0));
    return list;
  }, [filter, sort, search, sectorFilter]);

  const featuredIdea = IDEAS.find(i=>i.id==='glyph');

  return (
    <div>
      {effectiveLayout==='editorial' && filter!=='Concept' && !search && sectorFilter==='All' && (
        <div style={{
          marginBottom:32,padding:isMobile?'24px 20px':'36px',
          background:'linear-gradient(180deg,#ece8de 0%,#f6f4ef 100%)',
          border:`0.5px solid ${TOKENS.hair}`,borderRadius:16,
          display:'grid',gridTemplateColumns:isMobile?'1fr':'1.2fr 1fr',gap:isMobile?24:36,alignItems:'center',
        }}>
          <div>
            <Pill tone="closing" dot style={{marginBottom:14}}>Closing in {featuredIdea.raise.daysLeft}d</Pill>
            <h1 style={{fontFamily:SERIF,fontSize:isMobile?30:38,fontWeight:500,color:TOKENS.ink,margin:'0 0 12px',letterSpacing:'-0.015em',lineHeight:1.1}}>{featuredIdea.name}</h1>
            <p style={{fontFamily:SERIF,fontSize:isMobile?16:19,color:TOKENS.ink2,margin:'0 0 20px',lineHeight:1.4}}>{featuredIdea.tagline}. {featuredIdea.summary}</p>
            <div style={{display:'flex',alignItems:'center',gap:isMobile?16:24,marginBottom:22,flexWrap:'wrap'}}>
              {featuredIdea.metrics.slice(0,3).map((m,i)=><Stat key={i} {...m}/>)}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
              <Btn variant="raise" onClick={()=>go('idea/'+featuredIdea.id)}>Read raise · {fmtMoney(featuredIdea.raise.target)}</Btn>
              <Btn variant="ghost" onClick={()=>go('idea/'+featuredIdea.id)}>View deck {Icon.arrow(12)}</Btn>
            </div>
          </div>
          {!isMobile && <CoverArt tone={featuredIdea.coverTone} height={280} label="Editor's pick · this week"/>}
        </div>
      )}

      <FilterBar filter={filter} setFilter={setFilter} sort={sort} setSort={setSort} search={search} setSearch={setSearch} sectorFilter={sectorFilter} setSectorFilter={setSectorFilter}/>

      {ideas.length===0 && (
        <EmptyState icon={Icon.search(24)} title="No ideas found" body="Try clearing your filters or searching something else." cta="Clear filters" onCta={()=>{ setFilter('all'); setSearch(''); setSectorFilter('All'); }}/>
      )}

      {effectiveLayout==='editorial' && ideas.length>0 && (
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:22}}>
          {ideas.map((i,idx)=>(
            <EditorialCard key={i.id} idea={i} animDelay={idx*50} onOpen={()=>go('idea/'+i.id)} onVote={()=>toggleVote(i.id)} voted={voted[i.id]} onShortlist={()=>toggleShortlist(i.id)} shortlisted={shortlisted[i.id]}/>
          ))}
        </div>
      )}

      {effectiveLayout==='grid' && ideas.length>0 && (
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:18}}>
          {ideas.map((i,idx)=>(
            <GridCard key={i.id} idea={i} animDelay={idx*40} onOpen={()=>go('idea/'+i.id)} onVote={()=>toggleVote(i.id)} voted={voted[i.id]}/>
          ))}
        </div>
      )}

      {effectiveLayout==='feed' && ideas.length>0 && (
        <Card style={{overflow:'hidden'}}>
          {ideas.map((i,idx)=>(
            <FeedRow key={i.id} idea={i} rank={idx+1} onOpen={()=>go('idea/'+i.id)} onVote={()=>toggleVote(i.id)} voted={voted[i.id]}/>
          ))}
        </Card>
      )}
    </div>
  );
}

            {[1,2,3,4,5].map(i=>(
              <button key={i} onClick={()=>setRating(i)} onMouseEnter={()=>setHoverRating(i)} onMouseLeave={()=>setHoverRating(0)} style={{border:0,background:'transparent',cursor:'pointer',color:(hoverRating||rating)>=i?TOKENS.warn:TOKENS.ink4,padding:2,display:'flex'}}>
                {Icon.starFilled(22)}
              </button>

            {(rating>0)&&<span style={{fontFamily:SANS,fontSize:12,color:TOKENS.ink3,marginLeft:4}}>{ratingLabel}</span>}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>

                <div style={{flex:1}}/>

                  {[1,2,3,4,5].map(n=>(
                    <span key={n} style={{color:n<=v.rating?TOKENS.warn:TOKENS.ink4}}>{Icon.starFilled(13)}</span>
                  ))}
                </div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
                <div style={{padding:12,background:TOKENS.raiseBg,borderRadius:8}}>

      <Btn variant="raise" size="md" onClick={onCommit}>Invest {cur}{fmtMoney(idea.raise.minTicket,cur)}</Btn>

  ) : null;

            { i:Icon.external(14), t:'Live demo', s:'try.backable.com/'+idea.id },
            { i:Icon.doc(), t:'Data room', s:'NDA-gated · request access' },

            <Card key={i} hoverable style={{padding:18,display:'flex',alignItems:'center',gap:14}}>
              <div style={{width:36,height:36,borderRadius:8,background:'#efece4',display:'flex',alignItems:'center',justifyContent:'center',color:TOKENS.ink2}}>{x.i}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontFamily:SANS,fontSize:13,fontWeight:500,color:TOKENS.ink}}>{x.t}</div>
                <div style={{fontFamily:SANS,fontSize:11,color:TOKENS.ink3,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{x.s}</div>
              </div>
            </Card>
          ))}
        </div>
      </Section>
    </div>
  );

  const TractionTab = (
    <div style={{display:'flex',flexDirection:'column',gap:24}}>
      {idea.metrics ? (
        <>
          <Card style={{padding:28,display:'grid',gridTemplateColumns:isMobile?'1fr 1fr':`repeat(${idea.metrics.length},1fr)`,gap:24}}>
            {idea.metrics.map((m,i)=><Stat key={i} {...m} accent={TOKENS.raise}/>)}
          </Card>
          <Card style={{padding:24}}>
            <div style={{fontFamily:MONO,fontSize:10,letterSpacing:'0.12em',textTransform:'uppercase',color:TOKENS.ink3,marginBottom:12}}>Founder narrative</div>
            <p style={{fontFamily:SERIF,fontSize:16,color:TOKENS.ink2,lineHeight:1.6,margin:0}}>{idea.traction}</p>
          </Card>
          <Card style={{padding:20,display:'flex',gap:14,alignItems:'flex-start',background:TOKENS.raiseBg,border:`0.5px solid rgba(31,93,58,0.2)`}}>
            <div style={{color:TOKENS.raise,display:'flex',flexShrink:0,marginTop:2}}>{Icon.check(18)}</div>
            <div>
              <div style={{fontFamily:SANS,fontSize:13,fontWeight:500,color:TOKENS.raise,marginBottom:4}}>Traction verified</div>
              <div style={{fontFamily:SANS,fontSize:12,color:TOKENS.ink2,lineHeight:1.5}}>Revenue figures confirmed via Stripe integration. User metrics from product analytics.</div>
            </div>
          </Card>
        </>
      ) : (
        <EmptyState icon={Icon.chart(22)} title="No traction data" body="This founder hasn't added traction metrics yet."/>
      )}
    </div>
  );

  const CommunityTab = (
    <div>
      <Card style={{padding:22}}>
        <div style={{display:'flex',gap:12,marginBottom:14}}>
          <Avatar name="You" initials="AC" tone="#3a3830" size={32}/>
          <textarea placeholder="Ask a question, share what you tested, or push back…" style={{flex:1,minHeight:80,padding:12,borderRadius:8,border:`0.5px solid ${TOKENS.hair}`,background:TOKENS.surface,fontFamily:SERIF,fontSize:15,color:TOKENS.ink,resize:'vertical',outline:0}}/>
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
          <Btn size="sm" variant="ghost">Test this idea</Btn>
          <Btn size="sm" variant="primary">Post comment</Btn>
        </div>
        <div style={{marginTop:10}}>
          {comments.map((c,i)=><CommentRow key={i} c={c}/>)}
          {comments.length===0 && <div style={{padding:'24px 0',borderTop:`0.5px solid ${TOKENS.hair}`,fontFamily:SANS,fontSize:13,color:TOKENS.ink3,textAlign:'center'}}>Be the first to comment.</div>}

      </Card>
    </div>
  );

  const tabContent = {
    overview: Overview,
    deck: <DeckViewer idea={idea}/>,
    traction: TractionTab,
    community: CommunityTab,
    validation: <ValidationModule ideaId={idea.id}/>,
  };

  const ConceptPanel = (
    <Card style={{padding:22}}>
      <Pill tone="concept" dot style={{marginBottom:12}}>Concept</Pill>
      <h3 style={{fontFamily:SERIF,fontSize:20,fontWeight:500,margin:'0 0 8px',color:TOKENS.ink}}>Not open for investment</h3>
      <p style={{fontFamily:SERIF,fontSize:14,color:TOKENS.ink2,margin:0,lineHeight:1.5}}>{idea.askLine}</p>
      <Divider style={{margin:'18px 0'}}/>
      <Btn variant="primary" size="md" full>Follow this concept</Btn>
      <Btn variant="ghost" size="md" full style={{marginTop:8}}>Offer to help build it</Btn>
    </Card>
  );

  return (
    <div>
      {Hero}
      {isMobile && MobileRaiseBanner}
      {TabNav}
      {isMobile ? (
        <div>{tabContent[activeTab]}</div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 360px',gap:36,alignItems:'start'}}>
          <div>{tabContent[activeTab]}</div>
          <div style={{position:'sticky',top:96}}>
            {idea.stage==='Raise' ? <InvestPanel idea={idea} onCommit={onCommit}/> : ConceptPanel}
          </div>
        </div>

}

function FounderOnboard({ go }) {
  const isMobile   = useMediaQuery('(max-width: 767px)');
  const toast      = useToast();
  const [step, setStep]     = React.useState(0);
  const [submitting, setSub] = React.useState(false);
  const [fieldErrors, setFE] = React.useState({});
  const [form, setForm] = React.useState({ name:'', tagline:'', sector:'', stage:'Raise', summary:'', traction:'', target:500000, minTicket:250, geo:'' });
  const upd = (k,v) => { setForm(f=>({...f,[k]:v})); setFE(e=>({...e,[k]:undefined})); };
  const steps = ['Identity & KYC','Idea basics','Materials','Raise terms','Review'];
  const back = () => setStep(s=>Math.max(0,s-1));

  // F02: validate step before advancing
  const validateStep = () => {
    const e = {};
    if (step===1) {
      if (!form.name.trim())    e.name    = 'Project name is required.';
      if (!form.tagline.trim()) e.tagline = 'A one-line tagline is required.';
      if (!form.sector.trim())  e.sector  = 'Sector is required.';
      if (!form.summary.trim()) e.summary = 'A project summary is required.';
      if (!form.geo.trim())     e.geo     = 'Location is required.';
    }
    setFE(e);
    return Object.keys(e).length === 0;
  };

  const next = () => {
    if (!validateStep()) return;
    setStep(s=>Math.min(steps.length-1,s+1));
  };

  const submit = async () => {
    if (!form.name.trim()) { toast('Please complete the idea details before submitting.','error'); setStep(1); return; }
    setSub(true);
    try {
      if (window.fbDb && window.fbAuth?.currentUser) {
        const uid = window.fbAuth.currentUser.uid;
        await window.fbDb.collection('startups').add({
          name:        form.name.trim(),
          tagline:     form.tagline.trim(),
          sector:      form.sector.trim(),
          stage:       form.stage,
          summary:     form.summary.trim(),
          traction:    form.traction.trim(),
          geo:         form.geo.trim(),
          founderId:   uid,
          status:      'pending_review',
          votes:       0,
          raise: {
            target:    Number(form.target),
            minTicket: Number(form.minTicket),
            valuation: '$5M cap',
            committed: 0,
            investors: 0,
            daysLeft:  60,
          },
          tags:        [],
          createdAt:   firebase.firestore.FieldValue.serverTimestamp(),
        });
      }
      toast(`"${form.name}" submitted! We'll review within 48 hours.`, 'success', 5000);
      go('founder-dashboard');
    } catch(err) {
      toast('Submission failed: ' + (err.message||'Unknown error'), 'error');
    } finally {
      setSub(false);
    }
  };

  return (
    <div style={{maxWidth:760,margin:'0 auto'}}>
      <div style={{marginBottom:28}}>
        <Pill tone="raise" dot style={{marginBottom:12}}>List an idea</Pill>
        <h1 style={{fontFamily:SERIF,fontSize:isMobile?28:36,fontWeight:500,color:TOKENS.ink,margin:0,letterSpacing:'-0.015em'}}>
          {step===4?'Almost there':step===0?"Let's verify you first":'Tell us about your idea'}
        </h1>
        <p style={{fontFamily:SERIF,fontSize:16,color:TOKENS.ink2,marginTop:8,lineHeight:1.5}}>
          {step===0&&'KYC takes 2 minutes. Required for any open raise.'}
          {step===1&&'A clean elevator pitch beats a long deck. We\'ll show this in Discover.'}
          {step===2&&'Add deck, demo, founder video, and traction proof. Skip what you don\'t have.'}
          {step===3&&'Set the legal structure of your raise. We default to a SAFE.'}
          {step===4&&'Review and submit. We\'ll review within 48h before publishing.'}
        </p>
      </div>
      <StepIndicator steps={steps} current={step}/>
      <Card style={{padding:isMobile?24:32}}>
        {step===0 && (
          <div style={{display:'flex',flexDirection:'column',gap:20}}>
            <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:16}}>
              <Field label="Legal first name" required><Input placeholder="As on your ID" full/></Field>
              <Field label="Legal last name" required><Input placeholder="As on your ID" full/></Field>
            </div>
            <Field label="Country of residence" required hint="Determines which regulatory regime applies."><Input placeholder="United States" full/></Field>
            <Field label="Government ID" required hint="Passport or driver's license. Encrypted at rest.">
              <UploadTile title="Upload ID" sub="Drag & drop or click (PDF, JPG, PNG)"/>
            </Field>
            <Field label="Selfie verification" required hint="Liveness check via our KYC partner.">
              <UploadTile title="Take selfie" sub="Opens camera · matches against your ID"/>
            </Field>
            <div style={{padding:14,background:TOKENS.warnBg,borderRadius:8,fontFamily:SANS,fontSize:12,color:TOKENS.warn,lineHeight:1.5}}>
              <b>Why we ask:</b> Opening an investment raise requires identity verification by law in every supported jurisdiction.
            </div>
          </div>
        )}
        {step===1 && (
          <div style={{display:'flex',flexDirection:'column',gap:20}}>
            <Field label="Project name" required>
              <Input value={form.name} onChange={(v)=>upd('name',v)} placeholder="e.g. Aurora Loops" full style={fieldErrors.name?{border:`0.5px solid ${TOKENS.closing}`}:{}}/>
              {fieldErrors.name && <div style={{fontFamily:SANS,fontSize:11,color:TOKENS.closing,marginTop:3}}>{fieldErrors.name}</div>}
            </Field>
            <Field label="One-line tagline" required hint="Max 100 chars. The hook that makes someone click.">
              <Input value={form.tagline} onChange={(v)=>upd('tagline',v)} placeholder="Closed-loop fertilizer from urban food waste" full style={fieldErrors.tagline?{border:`0.5px solid ${TOKENS.closing}`}:{}}/>
              {fieldErrors.tagline && <div style={{fontFamily:SANS,fontSize:11,color:TOKENS.closing,marginTop:3}}>{fieldErrors.tagline}</div>}
            </Field>
            <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:16}}>
              <Field label="Sector" required>
                <Input value={form.sector} onChange={(v)=>upd('sector',v)} placeholder="Climate, AI, Fintech…" full style={fieldErrors.sector?{border:`0.5px solid ${TOKENS.closing}`}:{}}/>
                {fieldErrors.sector && <div style={{fontFamily:SANS,fontSize:11,color:TOKENS.closing,marginTop:3}}>{fieldErrors.sector}</div>}
              </Field>
              <Field label="Where based" required>
                <Input value={form.geo} onChange={(v)=>upd('geo',v)} placeholder="Berlin, DE" full style={fieldErrors.geo?{border:`0.5px solid ${TOKENS.closing}`}:{}}/>
                {fieldErrors.geo && <div style={{fontFamily:SANS,fontSize:11,color:TOKENS.closing,marginTop:3}}>{fieldErrors.geo}</div>}
              </Field>
            </div>
            <Field label="Listing type" required>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                {[
                  { id:'Concept', t:'Concept', s:'Free · upvotes & feedback · no investment', icon:Icon.spark() },
                  { id:'Raise', t:'Open raise', s:'KYC required · accept SAFE commitments', icon:Icon.shield() },
                ].map(o=>{
                  const sel = form.stage===o.id;
                  return (
                    <button key={o.id} onClick={()=>upd('stage',o.id)} style={{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:6,padding:16,borderRadius:10,textAlign:'left',border:`0.5px solid ${sel?TOKENS.ink:TOKENS.hair}`,background:sel?'#efece4':TOKENS.surface,cursor:'pointer'}}>
                      <div style={{display:'inline-flex',alignItems:'center',gap:8,color:TOKENS.ink2}}>{o.icon}<span style={{fontFamily:SANS,fontSize:13,fontWeight:500,color:TOKENS.ink}}>{o.t}</span></div>
                      <span style={{fontFamily:SANS,fontSize:11,color:TOKENS.ink3,lineHeight:1.4}}>{o.s}</span>
                    </button>
                  );
                })}
              </div>
            </Field>
            <Field label="Summary" required hint="2-3 paragraphs. What you do, why now, who it's for.">
              <TextArea value={form.summary} onChange={(v)=>upd('summary',v)} rows={6} placeholder="We collect food waste from restaurants…"/>
            </Field>
          </div>
        )}
        {step===2 && (
          <div style={{display:'flex',flexDirection:'column',gap:20}}>
            <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:12}}>
              <UploadTile title="Pitch deck" sub="PDF or Keynote · we'll embed inline" accent="#e6e0d0"/>
              <UploadTile title="Founder video" sub="2-5 min · why you, why now" accent="#dee0d8"/>
              <UploadTile title="Live demo URL" sub="Where investors can test your product" accent="#d8e0e2" optional/>
              <UploadTile title="Data room" sub="Financials · NDA-gated, request-only" accent="#e2dad8" optional/>
            </div>
            <Field label="Traction" hint="Concrete proof. Revenue, users, waitlist, LOIs. Be specific.">
              <TextArea value={form.traction} onChange={(v)=>upd('traction',v)} rows={4} placeholder="Closed €42k pilot revenue with two restaurant groups…"/>
            </Field>
            <div style={{padding:16,background:'#efece4',borderRadius:10,display:'flex',gap:14,alignItems:'flex-start'}}>
              <div style={{width:28,height:28,borderRadius:6,background:TOKENS.ink,color:TOKENS.surface,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{Icon.spark()}</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:SANS,fontSize:13,fontWeight:500,color:TOKENS.ink,marginBottom:4}}>No deck? Use AI Cofounder</div>
                <div style={{fontFamily:SANS,fontSize:12,color:TOKENS.ink2,lineHeight:1.5,marginBottom:10}}>Generate a pitch deck, founder video script, and one-pager from your summary. <b>$29 per generation. First 5 listings free.</b></div>
                <Btn size="sm" variant="primary" onClick={()=>window.__comingSoon&&window.__comingSoon('AI deck generation')}>Generate with AI · $29</Btn>
              </div>
            </div>
          </div>
        )}
        {step===3 && (
          <div style={{display:'flex',flexDirection:'column',gap:20}}>
            <div style={{padding:14,background:TOKENS.raiseBg,border:`0.5px solid rgba(31,93,58,0.25)`,borderRadius:8,fontFamily:SANS,fontSize:12,color:TOKENS.raise,lineHeight:1.5}}>
              <b>Default structure: SAFE</b> via Backable's partner broker-dealer (FINRA-registered). Investors commit, funds escrow, you draw down on close. We file Form C with the SEC.
            </div>
            <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:16}}>
              <Field label="Target raise (USD)" required><Input value={form.target.toLocaleString()} placeholder="500,000" full/></Field>
              <Field label="Minimum ticket" required><Input value={form.minTicket} placeholder="250" full/></Field>
            </div>
            <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:16}}>
              <Field label="Valuation cap (post)" required><Input placeholder="6,000,000" full/></Field>
              <Field label="Discount %" hint="Applied if priced round happens before SAFE converts."><Input placeholder="20" full/></Field>
            </div>
            <Field label="Available to investors in" required>
              <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                {['🇺🇸 US','🇪🇺 EU','🇬🇧 UK','🇨🇦 Canada','🇸🇬 Singapore','🇰🇪 Kenya','🌍 Other'].map(g=>(
                  <Pill key={g} tone="outline" style={{cursor:'pointer',padding:'6px 12px'}}>{g}</Pill>
                ))}
              </div>
            </Field>
            <Field label="Use of funds" required><TextArea rows={4} placeholder="Hire 2 engineers (40%), GTM (30%), inventory (20%), legal & ops (10%)…"/></Field>
          </div>
        )}
        {step===4 && (
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            {[
              { k:'KYC', v:'Passed · ID verified', ok:true },
              { k:'Project', v:form.name||'Untitled idea', ok:!!form.name },
              { k:'Listing type', v:form.stage==='Raise'?'Open raise · SAFE':'Concept', ok:true },
              { k:'Materials', v:'Deck, video, demo URL', ok:true },
              { k:'Raise terms', v:'$500k target · $250 min', ok:true },
              { k:'Review', v:'Backable team will review within 48 hours', ok:false, info:true },
            ].map((r,i)=>(
              <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'14px 0',borderBottom:i<5?`0.5px solid ${TOKENS.hair}`:'none'}}>
                <div style={{width:22,height:22,borderRadius:999,background:r.info?'#efece4':TOKENS.raiseBg,color:r.info?TOKENS.ink2:TOKENS.raise,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {r.info?Icon.spark(12):Icon.check(12)}
                </div>
                <div style={{flex:1}}>
                  <div style={{fontFamily:SANS,fontSize:12,color:TOKENS.ink3}}>{r.k}</div>
                  <div style={{fontFamily:SANS,fontSize:14,color:TOKENS.ink,fontWeight:500}}>{r.v}</div>
                </div>
              </div>
            ))}
          </div>
        )}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:28,paddingTop:24,borderTop:`0.5px solid ${TOKENS.hair}`,flexWrap:'wrap',gap:12}}>
          <Btn variant="ghost" onClick={step===0?()=>go('discover'):back}>{step===0?'Cancel':'Back'}</Btn>
          <div style={{fontFamily:SANS,fontSize:11,color:TOKENS.ink3}}>Step {step+1} of {steps.length} · 5 free listings</div>
          <Btn variant="primary" onClick={step===4?submit:next} loading={submitting} disabled={submitting}>
            {step===4?(submitting?'Submitting…':'Submit for review'):'Continue'} {!submitting&&Icon.arrow(12)}
          </Btn>
        </div>
      </Card>
    </div>
  );
}

// ─── Responsive portfolio chart (U02) ────────────────────────────────────────
// Pure SVG bar chart — no external lib needed, responsive via viewBox
function PortfolioChart({ data }) {
  const [containerWidth, setContainerWidth] = React.useState(600);
  const ref = React.useRef(null);

  React.useEffect(() => {
    if (!ref.current) return;
    const ro = new ResizeObserver(entries => {
      const w = entries[0]?.contentRect.width;
      if (w) setContainerWidth(w);
    });
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);

  const H = 180, PAD_L = 48, PAD_R = 16, PAD_T = 20, PAD_B = 40;
  const W = containerWidth;
  const chartW = W - PAD_L - PAD_R;
  const chartH = H - PAD_T - PAD_B;
  const maxVal = Math.max(...data.map(d => Math.max(d.invested, d.current)), 1);
  const barW   = Math.max(14, Math.floor(chartW / data.length * 0.35));
  const gap    = chartW / data.length;

  const yLines = [0, 0.25, 0.5, 0.75, 1];

  return (
    <div ref={ref} style={{width:'100%', overflowX:'hidden'}}>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:'block'}}>
        {/* Y grid lines */}
        {yLines.map(pct => {
          const y = PAD_T + chartH * (1 - pct);
          const label = fmtMoney(Math.round(maxVal * pct));
          return (
            <g key={pct}>
              <line x1={PAD_L} y1={y} x2={W - PAD_R} y2={y}
                stroke={TOKENS.hair} strokeWidth="0.5" strokeDasharray="3,3"/>
              <text x={PAD_L - 6} y={y + 4} textAnchor="end"
                fontFamily={MONO} fontSize="9" fill={TOKENS.ink4}>{label}</text>
            </g>
          );
        })}
        {/* Bars */}
        {data.map((d, i) => {
          const cx       = PAD_L + gap * i + gap / 2;
          const hInvest  = (d.invested / maxVal) * chartH;
          const hCurrent = (d.current  / maxVal) * chartH;
          const yInvest  = PAD_T + chartH - hInvest;
          const yCurrent = PAD_T + chartH - hCurrent;
          const isDown   = d.current < d.invested;
          const isFlat   = d.current === 0;
          const barColor = isFlat ? TOKENS.closing : (isDown ? TOKENS.warn : TOKENS.raise);

          return (
            <g key={d.id}>
              {/* Invested bar (lighter) */}
              <rect x={cx - barW} y={yInvest} width={barW - 2} height={hInvest}
                fill={TOKENS.ink4} rx="3" opacity="0.5"/>
              {/* Current bar */}
              {d.current > 0 && (
                <rect x={cx + 2} y={yCurrent} width={barW - 2} height={hCurrent}
                  fill={barColor} rx="3"/>
              )}
              {/* X label — truncated on narrow screens */}
              <text x={cx} y={H - 6} textAnchor="middle"
                fontFamily={SANS} fontSize={containerWidth < 400 ? '8' : '10'}
                fill={TOKENS.ink3} clipPath={`url(#clip-${i})`}>
                {d.name.length > 8 ? d.name.slice(0,7)+'…' : d.name}
              </text>
            </g>
          );
        })}
        {/* Legend */}
        <g transform={`translate(${PAD_L},${H - 2})`}>
          <rect x="0" y="-10" width="8" height="8" fill={TOKENS.ink4} rx="2" opacity="0.5"/>
          <text x="11" y="-3" fontFamily={SANS} fontSize="9" fill={TOKENS.ink4}>Invested</text>
          <rect x="54" y="-10" width="8" height="8" fill={TOKENS.raise} rx="2"/>
          <text x="65" y="-3" fontFamily={SANS} fontSize="9" fill={TOKENS.ink3}>Current value</text>
        </g>
      </svg>
    </div>
  );
}

function CommitModal({ idea, onClose }) {
  const [step,       setStep]       = React.useState(0);
  const [signing,    setSigning]    = React.useState(false);
  const [signErr,    setSignErr]    = React.useState('');
  const toast = useToast();
  if (!idea) return null;
  const cur = idea.geo.includes('DE')?'€':'$';

  const handleSign = async () => {
    setSigning(true); setSignErr('');
    try {
      if (window.fbDb && window.fbAuth?.currentUser) {
        const uid = window.fbAuth.currentUser.uid;
        await window.fbDb.collection('commitments').add({
          ideaId:     idea.id,
          ideaName:   idea.name,
          userId:     uid,
          amount:     1000,
          currency:   cur === '€' ? 'EUR' : 'USD',
          instrument: 'SAFE',
          valuation:  idea.raise?.valuation || '$5M cap',
          status:     'pending_payment',
          createdAt:  firebase.firestore.FieldValue.serverTimestamp(),
        });
        // increment committed counter on the startup doc
        window.fbDb.collection('startups').doc(idea.id)
          .update({ 'raise.committed': firebase.firestore.FieldValue.increment(1000), 'raise.investors': firebase.firestore.FieldValue.increment(1) })
          .catch(()=>{});
      }
      setStep(2);
    } catch(err) {
      // Still advance — don't block on Firestore errors; log for ops
      console.warn('Commitment write failed:', err.message);
      setStep(2);
    } finally {
      setSigning(false);
    }
  };
  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,zIndex:1000,background:'rgba(20,18,12,0.45)',backdropFilter:'blur(4px)',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div onClick={(e)=>e.stopPropagation()} style={{width:'100%',maxWidth:520,background:TOKENS.surface,borderRadius:16,border:`0.5px solid ${TOKENS.hair}`,boxShadow:'0 20px 60px rgba(20,18,12,0.25)',overflow:'hidden'}}>
        <div style={{padding:'22px 28px',borderBottom:`0.5px solid ${TOKENS.hair}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div>
            <div style={{fontFamily:MONO,fontSize:10,letterSpacing:'0.12em',textTransform:'uppercase',color:TOKENS.ink3,marginBottom:2}}>Commit · {idea.name}</div>
            <div style={{fontFamily:SERIF,fontSize:20,fontWeight:500,color:TOKENS.ink}}>
              {step===0&&'Review your commitment'}
              {step===1&&'Sign the SAFE'}
              {step===2&&"You're in"}
            </div>
          </div>
          <button onClick={onClose} style={{width:32,height:32,borderRadius:8,border:`0.5px solid ${TOKENS.hair}`,background:TOKENS.surface,cursor:'pointer',color:TOKENS.ink3,fontSize:18,lineHeight:1,display:'flex',alignItems:'center',justifyContent:'center'}}>{Icon.close(14)}</button>
        </div>
        <div style={{padding:28}}>
          {step===0 && (
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              {[
                ['Investing in', idea.name],
                ['Instrument', `Post-money SAFE · ${idea.raise.valuation} cap`],
                ['Amount', `${cur}1,000`],
                ['Annual cap remaining after', '$10,200 of $11,200'],
                ['Funds escrowed by', 'North Capital (FINRA-registered)'],
                ['Refundable until', '48h before close · Apr 30, 2026'],
              ].map(([k,v],i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:i<5?`0.5px solid ${TOKENS.hair}`:'none'}}>
                  <span style={{fontFamily:SANS,fontSize:12,color:TOKENS.ink3}}>{k}</span>
                  <span style={{fontFamily:SANS,fontSize:13,color:TOKENS.ink,fontWeight:500}}>{v}</span>
                </div>
              ))}
              <div style={{padding:14,background:TOKENS.warnBg,borderRadius:8,fontFamily:SANS,fontSize:12,color:TOKENS.warn,lineHeight:1.5}}>
                Equity crowdfunding is high-risk and illiquid. You can lose your entire investment.
              </div>
            </div>
          )}
          {step===1 && (
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              <div style={{height:200,background:TOKENS.bg,borderRadius:8,padding:16,fontFamily:SERIF,fontSize:12,color:TOKENS.ink2,lineHeight:1.5,overflow:'auto'}}>
                <p style={{margin:0}}><b>SIMPLE AGREEMENT FOR FUTURE EQUITY</b></p>
                <p>This certifies that in exchange for the payment by the Investor of $1,000.00 (the "Purchase Amount"), {idea.name} (the "Company"), a Delaware corporation, hereby issues to the Investor the right to certain shares of the Company's capital stock…</p>
                <p>1. <b>Events.</b> Equity Financing. If there is an Equity Financing before the termination of this Safe…</p>
                <p>2. <b>Definitions.</b> "Post-Money Valuation Cap" means {idea.raise.valuation}…</p>
              </div>
              <Field label="Type your full legal name to sign"><Input full placeholder="Jane Doe"/></Field>
            </div>
          )}
          {step===2 && (
            <div style={{textAlign:'center',padding:'14px 0'}}>
              <div style={{width:56,height:56,borderRadius:999,background:TOKENS.raiseBg,color:TOKENS.raise,display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:14}}>{Icon.check(24)}</div>
              <div style={{fontFamily:SERIF,fontSize:18,color:TOKENS.ink2,lineHeight:1.5}}>
                $1,000 committed to {idea.name}.<br/>Funds escrowed. We'll email you when the raise closes.
              </div>
            </div>
          )}
        </div>
        <div style={{padding:'16px 28px',borderTop:`0.5px solid ${TOKENS.hair}`,display:'flex',justifyContent:'space-between',background:TOKENS.bg}}>
          <Btn variant="ghost" onClick={onClose}>{step===2?'Close':'Cancel'}</Btn>
          {step===0 && <Btn variant="raise" onClick={()=>setStep(1)}>Continue to SAFE {Icon.arrow(12)}</Btn>}
          {step===1 && <Btn variant="raise" onClick={handleSign} disabled={signing}>{signing?<Spinner size={14} color="#fff"/>:'Sign & commit'} {!signing&&Icon.arrow(12)}</Btn>}
        </div>
      </div>
    </div>
  );
}

function Notifications({ go }) {
  const IDEAS = useStartups();
  const isMobile = useMediaQuery('(max-width: 767px)');
  const [filter, setFilter] = React.useState('all');
  const [notifs, setNotifs] = React.useState(NOTIFICATIONS);

  const tabs = [
    { id:'all',        label:'All' },
    { id:'raise',      label:'Investments' },
    { id:'comment',    label:'Comments' },
    { id:'system',     label:'System' },
  ];

  const iconForType = (type) => {
    if (type==='raise')   return <div style={{width:32,height:32,borderRadius:999,background:TOKENS.raiseBg,color:TOKENS.raise,display:'flex',alignItems:'center',justifyContent:'center'}}>{Icon.chart(14)}</div>;
    if (type==='closing') return <div style={{width:32,height:32,borderRadius:999,background:TOKENS.closingBg,color:TOKENS.closing,display:'flex',alignItems:'center',justifyContent:'center'}}>{Icon.clock(14)}</div>;
    if (type==='comment') return <div style={{width:32,height:32,borderRadius:999,background:'#efece4',color:TOKENS.ink2,display:'flex',alignItems:'center',justifyContent:'center'}}>{Icon.comment(14)}</div>;
    if (type==='system')  return <div style={{width:32,height:32,borderRadius:999,background:TOKENS.blueBg,color:TOKENS.blue,display:'flex',alignItems:'center',justifyContent:'center'}}>{Icon.shield(14)}</div>;
    return <div style={{width:32,height:32,borderRadius:999,background:'#efece4',color:TOKENS.ink3,display:'flex',alignItems:'center',justifyContent:'center'}}>{Icon.bell(14)}</div>;
  };

  const filtered = filter==='all' ? notifs : notifs.filter(n=>n.type===filter||n.type==='closing'&&filter==='raise');
  const unreadCount = notifs.filter(n=>n.unread).length;

  const markAllRead = () => setNotifs(ns=>ns.map(n=>({...n,unread:false})));

  return (
    <div style={{maxWidth:680}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20,flexWrap:'wrap',gap:12}}>
        <div style={{display:'flex',gap:0,borderBottom:`0.5px solid ${TOKENS.hair}`,flex:1}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>setFilter(t.id)} style={{
              padding:'10px 16px',border:0,background:'transparent',cursor:'pointer',
              fontFamily:SANS,fontSize:13,fontWeight:filter===t.id?500:400,
              color:filter===t.id?TOKENS.ink:TOKENS.ink3,
              borderBottom:`2px solid ${filter===t.id?TOKENS.ink:'transparent'}`,
              marginBottom:-1,whiteSpace:'nowrap',transition:'all 120ms',
            }}>{t.label}</button>
          ))}
        </div>
        {unreadCount>0 && <button onClick={markAllRead} style={{border:0,background:'transparent',fontFamily:SANS,fontSize:12,color:TOKENS.ink3,cursor:'pointer',textDecoration:'underline',whiteSpace:'nowrap'}}>Mark all read</button>}
      </div>

      {filtered.length===0 ? (
        <EmptyState icon={Icon.bell(22)} title="All caught up" body="No notifications in this category."/>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:0}}>
          {filtered.map((n,i)=>(
            <div key={n.id} onClick={n.ideaId?()=>go('idea/'+n.ideaId):undefined} style={{
              display:'flex',gap:14,padding:'16px 18px',borderBottom:`0.5px solid ${TOKENS.hair}`,
              cursor:n.ideaId?'pointer':'default',
              background:n.unread?'rgba(31,93,58,0.03)':'transparent',
              transition:'background 120ms',borderRadius:i===0?'14px 14px 0 0':i===filtered.length-1?'0 0 14px 14px':'0',
            }}
              onMouseEnter={(e)=>n.ideaId&&(e.currentTarget.style.background=TOKENS.hair2)}
              onMouseLeave={(e)=>e.currentTarget.style.background=n.unread?'rgba(31,93,58,0.03)':'transparent'}
            >
              <div style={{flexShrink:0,marginTop:2}}>{iconForType(n.type)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontFamily:SANS,fontSize:13,color:TOKENS.ink,lineHeight:1.45,marginBottom:4}}>{n.body}</div>
                <div style={{fontFamily:SANS,fontSize:11,color:TOKENS.ink4}}>{n.when} ago{n.ideaId?` · ${IDEAS.find(i=>i.id===n.ideaId)?.name||''}`:''}</div>
              </div>
              {n.unread && <div style={{width:8,height:8,borderRadius:999,background:TOKENS.raise,flexShrink:0,marginTop:6}}/>}
              {n.ideaId && <div style={{color:TOKENS.ink4,display:'flex',alignItems:'center',flexShrink:0}}>{Icon.chevron(14,'right')}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── localStorage helpers (F04) ──────────────────────────────────────────────
function usePersisted(key, fallback) {
  const [value, setValue] = React.useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch { return fallback; }
  });
  const set = React.useCallback((updater) => {
    setValue(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
      return next;
    });
  }, [key]);
  return [value, set];
}

          onSelect={(role) => {
            setFbProfile(p=>({...p, role}));
            const roleHome = { investor:'home', founder:'founder-dashboard', student:'discover' };
            setRoute(roleHome[role] || 'home');
          }}
        />
      </ToastProvider>
      </StartupsCtx.Provider>
    );
  }

  // ── Unauthenticated gate (not guest) ─────────────────────────
  if (!fbUser && !guestMode) {
    return (
      <StartupsCtx.Provider value={startups}>
      <ToastProvider>
        <AuthGate
          onGuest={()=>setGuestMode(true)}
          onSignIn={()=>setAuthModal('signin')}
          onSignUp={()=>setAuthModal('signup')}
        />
        {authModal && <AuthModal defaultTab={authModal} onClose={()=>setAuthModal(null)}/>}
      </ToastProvider>
      </StartupsCtx.Provider>
    );
  }

  return (
    <StartupsCtx.Provider value={startups}>
    <ToastProvider>
    <div style={{display:'flex',minHeight:'100vh',background:TOKENS.bg}}>
      <Nav current={navCurrent} go={go} user={user} onSignIn={()=>setAuthModal('signin')} onSignUp={()=>setAuthModal('signup')} onComingSoon={setComingSoon}
           onSignOut={fbUser ? async()=>{ try{ await fbSignOut(); }catch(_){} setFbUser(null); setFbProfile(null); setGuestMode(false); } : null}/>

      <main style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',paddingBottom:isMobile?72:0}}>
        <TopBar
          title={meta.title}
          kicker={meta.kicker}
          onSearch={meta.showSearch?(v)=>setSearch(v):undefined}
          search={search}
          go={go}
          right={!isMobile && (
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              {/* Layout switcher on discover */}
              {route==='discover' && (
                <div style={{display:'inline-flex',padding:2,background:'#efece4',borderRadius:7,border:`0.5px solid ${TOKENS.hair}`}}>
                  {['editorial','grid','feed'].map(l=>(
                    <button key={l} onClick={()=>setFeedLayout(l)} style={{
                      padding:'4px 10px',borderRadius:5,border:0,cursor:'pointer',
                      background:feedLayout===l?TOKENS.card:'transparent',
                      fontFamily:SANS,fontSize:11,fontWeight:500,
                      color:feedLayout===l?TOKENS.ink:TOKENS.ink3,
                      boxShadow:feedLayout===l?'0 1px 2px rgba(20,18,12,0.06)':'none',
                      textTransform:'capitalize',transition:'all 120ms',
                    }}>{l}</button>
                  ))}
                </div>
              )}
              {/* Notification bell */}
              <button onClick={()=>go('notifications')} style={{
                position:'relative',width:36,height:36,borderRadius:8,
                border:`0.5px solid ${TOKENS.hair}`,background:TOKENS.surface,
                display:'flex',alignItems:'center',justifyContent:'center',
                color:TOKENS.ink2,cursor:'pointer',
              }}>
                {Icon.bell(16)}
                {unreadCount>0 && (
                  <span style={{position:'absolute',top:6,right:6,width:8,height:8,borderRadius:999,background:TOKENS.raise,border:'1.5px solid #fbfaf6'}}/>
                )}
              </button>
              {route!=='founder-onboard'   && <Btn variant="ghost"   size="sm" onClick={()=>go('founder-onboard')} icon={Icon.plus(12)}>List an idea</Btn>}
              {route!=='investor-onboard'  && <Btn variant="primary" size="sm" onClick={()=>setAuthModal('signup')}>Become an investor</Btn>}
            </div>
          )}
        />

        <div style={{flex:1,padding:isMobile?'20px 16px 24px':'36px 36px 80px',maxWidth:1280,width:'100%',alignSelf:'center'}}>
          {renderContent()}
        </div>
      </main>

      {commitFor  && <CommitModal idea={commitFor} onClose={()=>setCommitFor(null)}/>}
      {authModal  && <AuthModal defaultTab={authModal} onClose={()=>setAuthModal(null)}/>}
      {comingSoon && <ComingSoonModal feature={comingSoon} onClose={()=>setComingSoon(null)}/>}
    </div>
    </ToastProvider>
    </StartupsCtx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

</script>
</body>
</html>
